<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flux Gestão</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Fraunces:wght@500;600&display=swap">
<style>
:root{--bg:#e9eef2;--ink:#1d2430;--mute:#6c7686;--card:rgba(255,255,255,.62);--line:rgba(255,255,255,.8);--y:#f6c945;--o:#ee7a1c;--g:#2fa866;--r:#d6453d;--b:#4c8fd6;--inp:rgba(255,255,255,.55);--hair:rgba(120,130,150,.22);--shine:rgba(255,255,255,.95);--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171c23;--ink:#eef1f5;--mute:#98a2b3;--card:rgba(40,48,60,.62);--line:rgba(255,255,255,.08);--inp:rgba(0,0,0,.25);--shine:rgba(255,255,255,.07);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171c23;--ink:#eef1f5;--mute:#98a2b3;--card:rgba(40,48,60,.62);--line:rgba(255,255,255,.08);--inp:rgba(0,0,0,.25);--shine:rgba(255,255,255,.07);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html.tt *,html.tt *::before,html.tt *::after{transition-property:background-color,color,border-color,fill,stroke,box-shadow!important;transition-duration:.5s!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px Outfit,system-ui,sans-serif;min-height:100vh;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased}
button:focus-visible,input:focus-visible,select:focus-visible,.task:focus-visible{outline:2px solid var(--b);outline-offset:2px}

/* ---------- Fundo: três manchas de luz que flutuam devagar ---------- */
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;will-change:transform}
.orbs i:nth-child(1){width:640px;height:640px;left:calc(55% - 320px);top:calc(28% - 320px);background:radial-gradient(closest-side,rgba(246,201,69,.5),transparent);animation:d1 28s ease-in-out infinite alternate}
.orbs i:nth-child(2){width:780px;height:780px;left:-280px;top:-280px;background:radial-gradient(closest-side,rgba(120,170,220,.45),transparent);animation:d2 34s ease-in-out infinite alternate}
.orbs i:nth-child(3){width:620px;height:620px;right:-240px;top:calc(60% - 310px);background:radial-gradient(closest-side,rgba(238,122,28,.2),transparent);animation:d3 30s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(-110px,80px) scale(1.12)}}
@keyframes d2{to{transform:translate(120px,90px) scale(1.08)}}
@keyframes d3{to{transform:translate(-80px,-100px) scale(1.15)}}

#root{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:14px}
#root>.out{animation:out .26s ease-in forwards}
@keyframes out{to{opacity:0;transform:translateY(-12px) scale(.98)}}
.view{animation:viewIn .8s var(--ease) backwards}
@keyframes viewIn{from{opacity:0;transform:translateY(26px) scale(.97)}}

/* ---------- Navegação ---------- */
nav{display:flex;align-items:center;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.app nav{animation:navIn .7s var(--ease) backwards}
@keyframes navIn{from{opacity:0;transform:translateY(-16px)}}
.logo{font:600 22px Fraunces,Georgia,serif;margin-right:4px;display:flex;align-items:center;gap:8px;flex:none}
.mk{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--y),var(--o));display:inline-block}
.login .mk{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.45);box-shadow:0 0 0 7px rgba(246,201,69,.2)}}
.tabs,.seg{position:relative;display:flex;gap:2px;padding:4px;border-radius:99px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);flex:none}
.pill{position:absolute;top:4px;left:0;height:calc(100% - 8px);width:0;border-radius:99px;background:var(--ink);box-shadow:0 4px 14px rgba(30,40,60,.25);transition:transform .55s var(--ease),width .55s var(--ease),background-color .5s;pointer-events:none}
.tabs button,.seg button{position:relative;z-index:1;border:0;background:none;color:var(--ink);padding:8px 14px;border-radius:99px;font:500 13px Outfit,sans-serif;cursor:pointer;white-space:nowrap;transition:color .35s var(--ease)}
.tabs button.on,.seg button.on{color:var(--bg)}
.seg{margin:12px 0 4px}.seg button{flex:1}
button.chip{border:1px solid var(--line);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);padding:8px 14px;border-radius:99px;font:500 13px Outfit,sans-serif;cursor:pointer;white-space:nowrap;transition:transform .25s var(--ease),box-shadow .25s}
button.chip:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(30,40,60,.1)}
button.chip:active{transform:scale(.95)}
button.chip.ico{padding:8px 10px;display:grid;place-items:center}
.tg{transition:transform .7s var(--spring)}
html[data-theme="dark"] .tg{transform:rotate(180deg)}
.sp{flex:1}

/* ---------- Tipografia e cartões ---------- */
h1{font:500 30px Fraunces,Georgia,serif;margin:22px 0 2px;letter-spacing:-.4px}
.lh1{font-size:26px;margin:14px 0 4px}
.sub{color:var(--mute);margin:0 0 16px;max-width:64ch;line-height:1.5}
.grid{display:grid;gap:12px}.k4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 8px 28px rgba(30,40,60,.08)}
.card h3{margin:0 0 10px;font-size:13px;font-weight:500;color:var(--mute);display:flex;align-items:center;gap:7px}
.big{font-size:30px;font-variant-numeric:tabular-nums}.d{font-size:12px;margin-left:6px;color:var(--mute)}.cap{font-size:11px;color:var(--mute);margin-top:6px}
.cnt{font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.cn{margin-left:auto;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--hair);color:var(--ink)}
.spark{display:flex;align-items:flex-end;gap:3px;height:42px;margin-top:10px}
.spark i{flex:1;background:linear-gradient(var(--o),var(--y));border-radius:2px;min-height:3px}
.bar{height:8px;border-radius:9px;background:var(--hair);overflow:hidden;margin:8px 0}.bar b{display:block;height:100%;background:var(--g);border-radius:9px}
.stack{display:flex;height:22px;border-radius:7px;overflow:hidden;margin:10px 0 8px;gap:2px}.stack i{display:block;min-width:2px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mute);font-size:12px}.leg b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.gauge{display:block;margin:0 auto;max-width:210px;width:100%}
table{width:100%;border-collapse:collapse}th{text-align:left;font-weight:500;color:var(--mute);font-size:12px;padding:6px 8px}td{padding:9px 8px;border-top:1px solid var(--hair);transition:background-color .25s}.tw{overflow-x:auto}
tr:hover>td{background:rgba(246,201,69,.09)}
.tag{padding:2px 9px;border-radius:99px;font-size:11px;background:rgba(47,168,102,.18);color:var(--g);transition:background-color .4s,color .4s}.tag.w{background:rgba(238,122,28,.18);color:var(--o)}.tag.x{background:rgba(214,69,61,.16);color:var(--r)}
.btn{position:relative;background:var(--y);border:0;color:#2a2200;padding:9px 16px;border-radius:99px;font:600 13px Outfit,sans-serif;cursor:pointer;transition:transform .25s var(--ease),box-shadow .3s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(238,122,28,.28)}
.btn:active{transform:scale(.97)}
.btn.l{width:100%;padding:15px;font-size:16px;margin-top:12px}
.busy{pointer-events:none;color:transparent!important}
.busy:after{content:"";position:absolute;inset:0;margin:auto;width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(42,34,0,.22);border-top-color:#2a2200;animation:spin .7s linear infinite}
.chip.busy:after{border-color:var(--hair);border-top-color:var(--ink)}
@keyframes spin{to{transform:rotate(360deg)}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
input,select{font:inherit;color:var(--ink);background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:70px;transition:border-color .25s,box-shadow .25s,background-color .5s}
input:focus,select:focus{outline:0;border-color:var(--y);box-shadow:0 0 0 4px rgba(246,201,69,.3)}
input[type=checkbox]{accent-color:var(--o)}
label{display:block;color:var(--mute);font-size:12px;margin:10px 0 4px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.row>*{flex:1}.row>.btn{flex:none}
.empty p{margin:0 0 4px;color:var(--mute)}

/* ---------- Primeiros passos ---------- */
.steps{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.steps li{display:flex;align-items:center;gap:10px;color:var(--mute)}
.steps li.done{color:var(--ink)}
.steps button{all:unset;display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:8px}
.steps button:hover .st{color:var(--ink);transform:translateX(3px)}.st{transition:transform .3s var(--ease),color .3s}
.steps button:focus-visible{outline:2px solid var(--b);outline-offset:3px}
.ck{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--hair);display:grid;place-items:center;transition:background-color .3s,border-color .3s}
.done .ck{background:var(--g);border-color:var(--g)}
.ck svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:16;stroke-dashoffset:16}
.done .ck svg{stroke-dashoffset:0}

/* ---------- Quadros ---------- */
.kan{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;align-items:start}
.task{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--tc,var(--hair));border-radius:12px;padding:11px;margin-top:8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;transition:transform .3s var(--ease),box-shadow .3s}
.task:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(30,40,60,.12)}
.task:active{transform:scale(.98)}
.task small{color:var(--mute);display:block;margin-top:4px}
.task.done b{opacity:.55;text-decoration:line-through;text-decoration-thickness:1px}
.x{all:unset;cursor:pointer;color:var(--mute);padding:0 6px;font-size:16px;line-height:1;transition:color .2s,transform .3s var(--spring)}.x:hover{color:var(--r);transform:scale(1.3)}.x:focus-visible{outline:2px solid var(--b)}
.none{border:1.5px dashed var(--hair);border-radius:12px;padding:16px;text-align:center;color:var(--mute);margin-top:8px}

/* ---------- Mensagens, ponto ao vivo e comprovante ---------- */
.login{min-height:90vh;display:grid;place-items:center}.lc{width:100%;max-width:380px}
.msg{padding:12px;border-radius:12px;margin-top:12px;font-weight:500;transition:background-color .4s,color .4s}
.msg.in,.fi{animation:fi .55s var(--ease) backwards}
@keyframes fi{from{opacity:0;transform:translateY(10px)}}
.fo{opacity:0;transform:translateY(6px);transition:opacity .15s,transform .15s}
.ok{background:rgba(47,168,102,.18);color:var(--g)}.no{background:rgba(214,69,61,.15);color:var(--r)}
.dotp{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:8px;position:relative}
.dotp:after{content:"";position:absolute;inset:0;border-radius:50%;background:currentColor;animation:ping 1.7s ease-out infinite}
.msg.no .dotp:after{display:none}
@keyframes ping{to{transform:scale(3);opacity:0}}
.meter{height:6px;border-radius:9px;background:rgba(120,130,150,.25);overflow:hidden;margin-top:9px}
.meter b{display:block;height:100%;width:0;border-radius:9px;background:currentColor;transition:width .9s var(--ease)}
.okc{display:block;width:68px;height:68px;margin:14px auto 2px;animation:okpop .6s var(--spring) backwards}
@keyframes okpop{from{transform:scale(.5);opacity:0}}
.okc circle{fill:rgba(47,168,102,.14);stroke:var(--g);stroke-width:2.5;stroke-dasharray:146;stroke-dashoffset:146;animation:dr .7s var(--ease) forwards}
.okc path{fill:none;stroke:var(--g);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:dr .45s var(--ease) .5s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.ticket{animation:rise .8s var(--ease) .3s backwards}
.ticket .ln{animation:rise .6s var(--ease) backwards;animation-delay:calc(.55s + var(--i,0)*90ms);line-height:1.7}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,26px) scale(.95);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;z-index:9;max-width:90vw;display:flex;align-items:center;gap:10px;box-shadow:0 12px 32px rgba(0,0,0,.25);transition:opacity .35s,transform .55s var(--spring)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.td{width:9px;height:9px;border-radius:50%;background:var(--y);flex:none}.td.ok{background:var(--g)}.td.no{background:var(--r)}

/* ---------- Entrada das telas ---------- */
main.leave{animation:leave .21s ease-in forwards}
@keyframes leave{to{opacity:0;transform:translate3d(calc(var(--dir,0)*-30px),-6px,0)}}
.rise{animation:rise .75s var(--ease) backwards;animation-delay:calc(var(--i,0)*70ms + 40ms)}
@keyframes rise{from{opacity:0;transform:translate3d(calc(var(--dir,0)*36px),20px,0) scale(.985)}}
.animate .spark i{transform-origin:bottom;animation:grow .8s var(--ease) backwards;animation-delay:calc(var(--k,0)*35ms + 320ms)}
@keyframes grow{from{transform:scaleY(0)}}
.animate .bar b{transform-origin:left;animation:sx 1.1s var(--ease) .4s backwards}
@keyframes sx{from{transform:scaleX(0)}}
.animate .stack{animation:reveal 1.1s var(--ease) .4s backwards}
@keyframes reveal{from{clip-path:inset(0 100% 0 0 round 7px)}to{clip-path:inset(0 0 0 0 round 7px)}}
.animate .gfill{animation:gdraw 1.4s var(--ease) .3s backwards}
@keyframes gdraw{from{stroke-dasharray:0 100}}
.animate .done .ck{animation:pop .5s var(--spring) backwards;animation-delay:calc(.5s + var(--k,0)*.12s)}
.animate .done .ck svg{animation:dr2 .5s var(--ease) backwards;animation-delay:calc(.6s + var(--k,0)*.12s)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes dr2{from{stroke-dashoffset:16}}
.animate tr{animation:rowIn .6s var(--ease) backwards;animation-delay:calc(var(--r,0)*40ms + 350ms)}
@keyframes rowIn{from{opacity:0;transform:translateX(-10px)}}
.flash{animation:flash 1.3s ease-out}
@keyframes flash{from{background-color:rgba(246,201,69,.5)}}
.sk{height:110px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(100deg,var(--card) 30%,var(--shine) 50%,var(--card) 70%) 0 0/220% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-220% 0}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
@media print{.orbs,nav,#toast,.noprint,.seg{display:none!important}body{background:#fff;color:#000}.card{background:#fff;box-shadow:none;border:1px solid #ccc;backdrop-filter:none}}
</style></head><body>
<div class="orbs" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="root"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),R=v=>'R$ '+(+v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wait=ms=>new Promise(r=>setTimeout(r,ms)),still=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
let TOKEN=null;try{TOKEN=sessionStorage.getItem('tk')}catch(e){}
const S={tab:'painel',mode:'g'};let P=[];
const fmt={R:v=>R(v),p:v=>Math.round(v)+'%',q:v=>(Math.round(v*10)/10).toLocaleString('pt-BR')+'%',i:v=>String(Math.round(v))};
const cnt=(v,f)=>`<span class="cnt" data-v="${+v||0}" data-f="${f}">${fmt[f](+v||0)}</span>`;

/* ---------- Utilidades de movimento ---------- */
function toast(t,k){const e=$('#toast');e.innerHTML=`<i class="td ${k||''}"></i><span>${esc(t)}</span>`;
 if(e.classList.contains('show')&&!still())e.animate([{transform:'translate(-50%,0) scale(.95)'},{transform:'translate(-50%,0) scale(1)'}],{duration:260,easing:'cubic-bezier(.34,1.56,.64,1)'});
 e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),3500)}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');el.addEventListener('animationend',()=>el.classList.remove('shake'),{once:true})}
function tween(el,from,to,ms){const fm=fmt[el.dataset.f];if(still()||from===to){el.textContent=fm(to);return}
 const t0=performance.now(),e=t=>t>=1?1:1-Math.pow(2,-10*t),step=n=>{const p=Math.min(1,(n-t0)/ms);el.textContent=fm(from+(to-from)*e(p));if(p<1)requestAnimationFrame(step)};
 el.textContent=fm(from);requestAnimationFrame(step)}
async function gone(el){if(!el||still())return;const row=el.tagName=='TR',h=el.offsetHeight;el.style.overflow='hidden';
 const k=row?[{opacity:1,transform:'none'},{opacity:0,transform:'translateX(30px)'}]:[{opacity:1,transform:'none',maxHeight:h+'px'},{opacity:0,transform:'translateX(36px) scale(.96)',maxHeight:'0px',marginTop:'0px',paddingTop:'0px',paddingBottom:'0px',borderWidth:'0px'}];
 try{await el.animate(k,{duration:row?260:380,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}).finished}catch(e){}}
function placePill(box,instant){const pill=box&&box.querySelector('.pill'),on=box&&box.querySelector('button.on');if(!pill||!on)return;
 if(instant)pill.style.transition='none';
 pill.style.width=on.offsetWidth+'px';pill.style.transform=`translateX(${on.offsetLeft}px)`;
 if(instant){void pill.offsetWidth;pill.style.transition=''}}
const placeAll=i=>document.querySelectorAll('.tabs,.seg').forEach(b=>placePill(b,i));
addEventListener('resize',()=>placeAll(true));document.fonts&&document.fonts.ready.then(()=>placeAll(true));

async function api(path,method='GET',body){
 const r=await fetch(path,{method,headers:{'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})},body:body?JSON.stringify(body):undefined});
 const j=await r.json().catch(()=>({}));
 if(r.status==401&&TOKEN&&path!='/auth/login'){sair(true);throw new Error(j.detail||'Sessão expirada.')}
 if(!r.ok)throw new Error(Array.isArray(j.detail)?'Confira os dados informados.':(j.detail||'Erro inesperado.'));return j}
const run=async(f,btn)=>{if(btn){if(btn.classList.contains('busy'))return;btn.classList.add('busy')}
 try{await f()}catch(e){toast(e.message,'no');if(btn&&btn.isConnected)shake(btn)}finally{if(btn&&btn.isConnected)btn.classList.remove('busy')}};
function sair(local){if(!local)api('/auth/logout','POST').catch(()=>{});TOKEN=null;try{sessionStorage.removeItem('tk')}catch(e){}tela()}
function tema(){const r=document.documentElement,n=r.dataset.theme=='dark'?'light':'dark';r.classList.add('tt');r.dataset.theme=n;try{localStorage.setItem('theme',n)}catch(e){}clearTimeout(tema.t);tema.t=setTimeout(()=>r.classList.remove('tt'),650)}
function pos(){return new Promise((ok,er)=>{if(!navigator.geolocation)return er(new Error('Seu navegador não tem localização.'));navigator.geolocation.getCurrentPosition(ok,()=>er(new Error('Ative o GPS e permita o acesso à localização.')),{enableHighAccuracy:true,timeout:15000})})}

/* ---------- Troca de tela raiz (login ⇄ painel) ---------- */
let SWAP=0;
async function swapRoot(html){const id=++SWAP,root=$('#root'),old=root.firstElementChild;
 if(old&&!still()){old.classList.add('out');await wait(260)}
 if(id!==SWAP)return false;root.innerHTML=html;return true}

/* ---------- Login / Ponto do funcionário (localização em tempo real) ---------- */
let W=null,BUF=[],LAST=0,FILL=0;
function stopWatch(){if(W!=null&&navigator.geolocation)navigator.geolocation.clearWatch(W);W=null;BUF=[]}
function tela(){stopWatch();return TOKEN?app():login()}
async function login(){stopWatch();
 if(!await swapRoot(`<div class="login"><div class="card lc view"><div class="logo"><i class="mk"></i>Flux</div>
 <div id="lh"><h1 id="lt" class="lh1"></h1><p class="sub" id="lsub" style="margin-bottom:6px"></p></div>
 <div class="seg" id="seg"><i class="pill"></i><button data-m="g" class="${S.mode=='g'?'on':''}" onclick="setMode('g')">Gestor</button><button data-m="p" class="${S.mode=='p'?'on':''}" onclick="setMode('p')">Bater ponto</button></div>

function startWatch(){if(W!=null)return;
 W=navigator.geolocation.watchPosition(p=>{const s={lat:p.coords.latitude,lng:p.coords.longitude,accuracy_m:p.coords.accuracy,ts_ms:p.timestamp};BUF.push(s);BUF=BUF.slice(-8);liveCheck(s)},
 ()=>{stopWatch();lmsg('Ative o GPS e permita o acesso à localização.',0)},{enableHighAccuracy:true,maximumAge:0,timeout:20000})}
async function liveCheck(s){const n=Date.now();if(n-LAST<3000)return;LAST=n;
 try{if(!$('#le'))return stopWatch();
  const j=await api('/clock/live','POST',{employee_id:+$('#le').value,pin:$('#lp').value,lat:s.lat,lng:s.lng,accuracy_m:s.accuracy_m});
  const el=$('#live');if(!el)return;
  if(el.style.display=='none'){el.style.display='block';el.className='msg in';el.innerHTML='<div><i class="dotp"></i><span></span></div><div class="meter"><b></b></div>'}
  el.classList.toggle('ok',j.inside);el.classList.toggle('no',!j.inside);
  el.querySelector('span').textContent=`${j.inside?'Dentro':'Fora'} da área: ${j.distance_m} m da sede (limite ${j.radius_m} m) · precisão ±${j.accuracy_m} m${j.gps_ok?'':' · sinal fraco'}`;
  const far=Math.max(0,j.distance_m-j.radius_m);el.querySelector('.meter b').style.width=(j.inside?100:Math.max(6,100-Math.min(100,far/Math.max(j.radius_m*4,200)*100)))+'%'}
 catch(e){stopWatch();lmsg(e.message,0)}}

 lmsg('Lendo sua localização em tempo real…',1);startWatch();
 const t0=Date.now();while(W!=null&&BUF.length<3&&Date.now()-t0<10000)await wait(300);
 if(W==null)return;
 if(!BUF.length)return lmsg('Não foi possível ler sua localização. Ative o GPS e tente de novo.',0);
 try{const j=await api('/clock','POST',{employee_id:+$('#le').value,pin:$('#lp').value,consent:true,samples:BUF.slice(-5)});stopWatch();comprovante(j)}
 catch(e){lmsg(e.message,0)}}

async function app(){
 if(!await swapRoot(`<div class="app"><nav><span class="logo"><i class="mk"></i>Flux</span><div class="tabs" id="tabs"><i class="pill"></i>${tabs.map(t=>`<button data-t="${t[0]}" class="${S.tab==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</div><span class="sp"></span>
 <button class="chip ico" title="Alternar tema" aria-label="Alternar tema" onclick="tema()"><svg class="tg" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="7.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 2.8a7.2 7.2 0 0 0 0 14.4z" fill="currentColor"/></svg></button><button class="chip" onclick="sair()">Sair</button></nav><main id="main"></main></div>`))return;
 placeAll(true);go(S.tab,{first:true})}
function markTabs(anim){document.querySelectorAll('#tabs button').forEach(b=>{const on=b.dataset.t==S.tab;b.classList.toggle('on',on);on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});
 placePill($('#tabs'),!anim);const n=$('nav'),a=$('#tabs .on');if(n&&a&&n.scrollWidth>n.clientWidth)n.scrollTo({left:a.offsetLeft-n.clientWidth/2+a.offsetWidth/2+$('#tabs').offsetLeft,behavior:still()?'auto':'smooth'})}
function snap(m){return{cnt:[...m.querySelectorAll('.cnt')].map(e=>+e.dataset.v),td:[...m.querySelectorAll('td')].map(e=>e.textContent),k:new Map([...m.querySelectorAll('[data-k]')].map(e=>[e.dataset.k,e.getBoundingClientRect()]))}}
function play(m,dir){m.style.setProperty('--dir',dir||0);const t=[];[...m.children].forEach(c=>c.matches('.grid,.kan')?t.push(...c.children):t.push(c));
 t.forEach((e,i)=>{e.style.setProperty('--i',Math.min(i,10));e.classList.add('rise')});
 m.querySelectorAll('.spark').forEach(s=>[...s.children].forEach((e,i)=>e.style.setProperty('--k',i)));
 m.querySelectorAll('.steps li').forEach((e,i)=>e.style.setProperty('--k',i));
 m.querySelectorAll('tr').forEach((e,i)=>e.style.setProperty('--r',Math.min(i,12)));
 m.classList.add('animate');m.querySelectorAll('.cnt').forEach(e=>tween(e,0,+e.dataset.v,1100))}
function settle(m,b){if(still())return;
 m.querySelectorAll('.cnt').forEach((e,i)=>{const f=b.cnt[i];if(f!=null&&f!==+e.dataset.v)tween(e,f,+e.dataset.v,550)});
 const td=[...m.querySelectorAll('td')];if(td.length&&td.length===b.td.length)td.forEach((e,i)=>{if(e.textContent!==b.td[i])e.classList.add('flash')});
 m.querySelectorAll('[data-k]').forEach(e=>{const a=b.k.get(e.dataset.k);
  if(!a)e.animate([{opacity:0,transform:'scale(.9) translateY(-10px)'},{opacity:1,transform:'none'}],{duration:480,easing:'cubic-bezier(.34,1.56,.64,1)'});
  else{const r=e.getBoundingClientRect(),dx=a.left-r.left,dy=a.top-r.top;if(dx||dy)e.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:560,easing:'cubic-bezier(.22,1,.36,1)'})}})}
let NAV=0;
async function go(tab,o={}){if(!TOKEN)return;const main=$('#main');if(!main)return;
 if(tab===S.tab&&!o.first&&!o.soft)o.soft=true;
 const seq=++NAV,ord=tabs.map(t=>t[0]),dir=o.soft||o.first?0:Math.sign(ord.indexOf(tab)-ord.indexOf(S.tab));
 const before=o.soft?snap(main):null;S.tab=tab;if(!o.soft)markTabs(!o.first);
 const data=TAB[tab]();data.catch(()=>{});
 if(!o.soft&&!o.first){main.style.setProperty('--dir',dir);main.className='leave';await wait(still()?0:210);if(seq!==NAV)return;if(scrollY>40)scrollTo({top:0,behavior:still()?'auto':'smooth'})}
 if(!o.soft&&!await Promise.race([data.then(()=>1,()=>1),wait(150).then(()=>0)])){if(seq!==NAV)return;main.className='';main.innerHTML=SKEL;play(main,0)}
 let html;try{html=await data}catch(e){if(seq!==NAV)return;
  if(!TOKEN||o.soft){toast(e.message,'no');return}
  main.className='';main.innerHTML=`<div class="card empty" style="margin-top:22px"><h3>Não foi possível carregar</h3><p>${esc(e.message)}</p><div class="row"><button class="btn" onclick="go(S.tab,{first:true})">Tentar de novo</button></div></div>`;play(main,0);return}

 main.className='';main.innerHTML=html;o.soft?settle(main,before):play(main,dir)}

<div class="card" style="margin-top:12px"><h3>Novo funcionário</h3><div class="row"><input id="en" placeholder="Nome"><input id="ec" placeholder="Cargo"><input id="ek" inputmode="numeric" maxlength="11" placeholder="CPF (11 números)"><input id="es" type="number" placeholder="Salário base"><input id="eb" type="number" placeholder="Benefícios"><input id="ep" type="password" inputmode="numeric" maxlength="8" placeholder="PIN do ponto (4 a 8 dígitos)"></div><div class="row"><button class="btn" onclick="run(addE,this)">Adicionar funcionário</button></div></div>`}
async function edE(id,k,v){await api('/employees/'+id,'PATCH',{[k]:+v||0});await refresh()}
async function addE(){const n=$('#en').value.trim();if(!n)return toast('Digite o nome.','no');await api('/employees','POST',{name:n,role:$('#ec').value,cpf:$('#ek').value,salary:+$('#es').value||0,benefits:+$('#eb').value||0,pin:$('#ep').value});await refresh()}

const dbr=d=>d.split('-').reverse().join('/');
TAB.financeiro=financeiro;
async function financeiro(){const [s,T]=await Promise.all([api('/finance/summary'),api('/finance?status=open')]),hoje=new Date().toLocaleDateString('sv');
 return `<h1>Financeiro</h1><p class="sub">Contas a pagar e a receber. A previsão de caixa já desconta a folha do mês.</p>
<div class="grid k4"><div class="card"><h3>A receber</h3><span class="big">${cnt(s.receber_aberto,'R')}</span><span class="d">${R(s.receber_vencido)} vencido</span></div><div class="card"><h3>A pagar</h3><span class="big">${cnt(s.pagar_aberto,'R')}</span><span class="d">${R(s.pagar_vencido)} vencido</span></div><div class="card"><h3>Folha mensal</h3><span class="big">${cnt(s.folha_mensal,'R')}</span></div></div>
<div class="card tw" style="margin-top:12px"><h3>Fluxo de caixa previsto</h3><table><tr><th>Mês</th><th>A receber</th><th>A pagar</th><th>Folha</th><th>Saldo</th></tr>${s.fluxo.map(f=>`<tr><td>${f.month.split('-').reverse().join('/')}</td><td>${R(f.receber)}</td><td>${R(f.pagar)}</td><td>${R(f.folha)}</td><td><span class="tag ${f.saldo<0?'x':''}">${R(f.saldo)}</span></td></tr>`).join('')}</table></div>
<div class="card tw" style="margin-top:12px"><h3>Lançamentos em aberto</h3>${T.length?`<table><tr><th>Tipo</th><th>Descrição</th><th>Vencimento</th><th>Valor</th><th></th></tr>${T.map(t=>`<tr data-k="x${t.id}"><td><span class="tag ${t.kind=='pagar'?'w':''}">${t.kind=='pagar'?'Pagar':'Receber'}</span></td><td>${esc(t.description)}</td><td>${dbr(t.due)}${t.due<hoje?' <span class="tag x">vencido</span>':''}</td><td>${R(t.amount)}</td><td style="white-space:nowrap"><button class="chip" onclick="run(()=>payT(${t.id}),this)">${t.kind=='pagar'?'Marcar como pago':'Marcar como recebido'}</button> <button class="chip" onclick="run(()=>delTx(${t.id}),this)" title="Excluir lançamento" aria-label="Excluir lançamento">×</button></td></tr>`).join('')}</table>`:'<p class="sub">Nenhum lançamento em aberto. Adicione o primeiro abaixo.</p>'}</div>
<div class="card" style="margin-top:12px"><h3>Novo lançamento</h3><div class="row"><select id="fk" aria-label="Tipo"><option value="receber">A receber</option><option value="pagar">A pagar</option></select><input id="fd" placeholder="Descrição"><input id="fv" type="number" min="0" step="0.01" placeholder="Valor"><input id="ft" type="date" aria-label="Vencimento"></div><div class="row"><button class="btn" onclick="run(addTx,this)">Adicionar lançamento</button></div></div>`}
async function payT(id){await api(`/finance/${id}/paid`,'PATCH');await gone($(`[data-k="x${id}"]`));await refresh()}
async function delTx(id){await api('/finance/'+id,'DELETE');await gone($(`[data-k="x${id}"]`));await refresh()}
async function addTx(){const d=$('#fd').value.trim(),v=+$('#fv').value,t=$('#ft').value;if(!d||!v||!t)return toast('Preencha descrição, valor e vencimento.','no');await api('/finance','POST',{kind:$('#fk').value,description:d,amount:v,due:t});await refresh()}

TAB.ponto=ponto;
async function ponto(){let w=null,co={name:'',cnpj:''};try{w=await api('/settings/workplace')}catch(e){}try{co=await api('/settings/company')}catch(e){}
 const m=S.month||new Date().toISOString().slice(0,7);S.month=m;
 const [L,TS]=await Promise.all([api('/time-entries?limit=30'),api('/timesheet?month='+m)]);
 return `<h1>Ponto eletrônico</h1><p class="sub">O funcionário só registra dentro do raio da sede, com a localização lida em tempo real no aparelho. A distância é conferida no servidor.</p>
<div class="grid g2"><div class="card"><h3>Local de trabalho</h3><p>${w?`Sede em ${w.lat.toFixed(5)}, ${w.lng.toFixed(5)}`:'Ainda não definido. Vá até o local de trabalho e use o botão abaixo.'}</p><label for="rr">Raio permitido (metros)</label><input id="rr" type="number" min="10" max="5000" value="${w?w.radius_m:100}"><div class="row"><button class="btn" onclick="run(setBase,this)">Usar minha localização atual como sede</button></div></div>
<div class="card"><h3>Dados da empresa no comprovante</h3><label for="cn">Razão social</label><input id="cn" value="${esc(co.name)}"><label for="cj">CNPJ (14 números)</label><input id="cj" inputmode="numeric" maxlength="14" value="${esc(co.cnpj)}"><div class="row"><button class="btn" onclick="run(saveCo,this)">Salvar dados</button></div></div></div>
<div class="card tw" style="margin-top:12px"><h3>Espelho de ponto</h3><div class="row" style="margin:0 0 8px"><input type="month" value="${m}" aria-label="Mês" onchange="S.month=this.value;refresh()"><button class="chip" onclick="run(exportCsv,this)">Exportar marcações (CSV)</button><button class="chip" onclick="run(verificar,this)">Verificar integridade</button></div>
<table><tr><th>Nome</th><th>Dias</th><th>Horas</th><th>Extras</th><th></th></tr>${TS.employees.map(e=>`<tr><td>${esc(e.name)}</td><td>${e.days.length}</td><td>${e.total_hours} h</td><td>${e.overtime_hours} h</td><td>${e.open?'<span class="tag w">marcação em aberto</span>':''}</td></tr>`).join('')}</table></div>
<div class="card" style="margin-top:12px"><h3>Registros</h3>${logRows(L)}</div>`}
async function setBase(){const p=await pos();await api('/settings/workplace','PUT',{lat:p.coords.latitude,lng:p.coords.longitude,radius_m:+$('#rr').value||100});toast('Local de trabalho salvo.','ok');await refresh()}
async function saveCo(){await api('/settings/company','PUT',{name:$('#cn').value.trim(),cnpj:$('#cj').value.trim()});toast('Dados da empresa salvos.','ok')}
async function exportCsv(){const r=await fetch('/time-entries/export.csv?month='+S.month,{headers:{Authorization:'Bearer '+TOKEN}});if(!r.ok)throw new Error('Não foi possível exportar.');const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='marcacoes-'+S.month+'.csv';a.click();URL.revokeObjectURL(a.href)}
async function verificar(){const j=await api('/time-entries/verify');toast(j.ok?`Integridade confirmada: ${j.checked} marcações sem alteração.`:`Alteração detectada na marcação NSR ${j.broken_nsr}.`,j.ok?'ok':'no')}
tela();
</script></body></html>
