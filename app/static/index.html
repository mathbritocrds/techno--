<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIGI Gestão</title>
<meta name="theme-color" content="#171D19">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script>const systemTheme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';const root=document.documentElement;try{root.dataset.theme=localStorage.getItem('theme')||systemTheme;const motion=localStorage.getItem('motion');root.dataset.motion=motion==='full'||motion==='reduced'?motion:'system'}catch(e){root.dataset.theme=systemTheme;root.dataset.motion='system'}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Fraunces:wght@500;600&display=swap">
<style>
:root{--bg:#F3F8F5;--ink:#35453E;--mute:#74827B;--card:rgba(255,255,255,.94);--line:rgba(80,126,103,.13);--y:#5E9D7C;--o:#D6A458;--g:#5B9B77;--r:#CF7771;--b:#7799B8;--btn-ink:#FFFFFF;--inp:#FFFFFF;--hair:rgba(80,126,103,.18);--shine:#F9FCFA;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);color-scheme:light}
:root[data-theme=dark]{--bg:#171D19;--ink:#E5ECE6;--mute:#A6B2A9;--card:rgba(35,43,38,.96);--line:rgba(173,194,179,.17);--y:#78B694;--o:#E2B96F;--g:#79C596;--r:#E98D86;--b:#8CB2D1;--btn-ink:#102019;--inp:#242D27;--hair:rgba(173,194,179,.22);--shine:#303A33;color-scheme:dark}
*{box-sizing:border-box}
:root[data-theme=dark] body{background:linear-gradient(135deg,#171D19 0%,#202521 52%,#24211F 100%)}
:root[data-theme=dark] .pill{background:rgba(120,182,148,.24);box-shadow:0 3px 10px rgba(0,0,0,.28)}
:root[data-theme=dark] .tabs button.on,:root[data-theme=dark] .seg button.on{color:var(--ink)}
:root[data-theme=dark] .tag{background:rgba(121,197,150,.18);color:#A6DDB7}
:root[data-theme=dark] .tag.w{background:rgba(226,185,111,.2);color:#E9CC8C}
:root[data-theme=dark] .tag.x{background:rgba(233,141,134,.18);color:#F0AAA4}
:root[data-theme=dark] .tag[style*="145,175,199"]{background:rgba(140,178,209,.2)!important;color:#BED3E5!important}
:root[data-theme=dark] .orbs i{opacity:.55}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html.tt *,html.tt *::before,html.tt *::after{transition-property:background-color,background-image,color,border-color,fill,stroke,box-shadow!important;transition-duration:.5s!important}
body{margin:0;background:linear-gradient(135deg,#F3F8F5 0%,#F7F8FC 52%,#FFF7F2 100%);color:var(--ink);font:14px Outfit,system-ui,sans-serif;min-height:100vh;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased}
button:focus-visible,input:focus-visible,select:focus-visible,.task:focus-visible{outline:2px solid var(--b);outline-offset:2px}

/* ---------- Fundo atmosférico em camadas, animado apenas por transform ---------- */
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;will-change:transform}
.orbs i:nth-child(1){width:420px;height:420px;left:calc(62% - 210px);top:calc(20% - 210px);background:radial-gradient(closest-side,rgba(120,182,148,.22),transparent);animation:d1 38s ease-in-out infinite alternate}
.orbs i:nth-child(2){width:520px;height:520px;left:-300px;top:calc(72% - 260px);background:radial-gradient(closest-side,rgba(145,175,199,.2),transparent);animation:d2 46s ease-in-out infinite alternate}
.orbs i:nth-child(3){width:360px;height:360px;right:-180px;top:calc(76% - 180px);background:radial-gradient(closest-side,rgba(232,162,142,.17),transparent);animation:d3 42s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate3d(-42px,34px,0) scale(1.06)}}
@keyframes d2{to{transform:translate3d(38px,-28px,0) scale(1.04)}}
@keyframes d3{to{transform:translate3d(-32px,-36px,0) scale(1.05)}}

#root{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:14px}
#root>.out{animation:out .26s ease-in forwards}
@keyframes out{to{opacity:0;transform:translateY(-12px) scale(.98)}}
.view{animation:viewIn .8s var(--ease) backwards}
@keyframes viewIn{from{opacity:0;transform:translateY(26px) scale(.97)}}

/* ---------- Navegação ---------- */
nav{display:flex;align-items:center;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;flex-wrap:nowrap}
nav::-webkit-scrollbar{display:none}
.app nav{animation:navIn .7s var(--ease) backwards}
@keyframes navIn{from{opacity:0;transform:translateY(-16px)}}
.logo{font:600 22px Fraunces,Georgia,serif;margin-right:4px;display:flex;align-items:center;gap:8px;flex:none}
.mk{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,#78B694,#E8A28E);display:inline-block}
.login .mk{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.45);box-shadow:0 0 0 7px rgba(120,182,148,.2)}}
.tabs,.seg{position:relative;display:flex;flex-wrap:nowrap;gap:2px;padding:4px;border-radius:99px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);flex:none}
.pill{position:absolute;top:4px;left:0;height:calc(100% - 8px);width:0;border-radius:99px;background:#DCEDE3;box-shadow:0 3px 10px rgba(80,126,103,.12);transition:transform .55s var(--ease),width .55s var(--ease),background-color .5s;pointer-events:none}
.tabs button,.seg button{position:relative;z-index:1;border:0;background:none;color:var(--ink);padding:8px 14px;border-radius:99px;font:500 13px Outfit,sans-serif;cursor:pointer;white-space:nowrap;transition:color .35s var(--ease)}
.tabs button.on,.seg button.on{color:#456B55}
.seg{margin:12px 0 4px}.seg button{flex:1}
button.chip{border:1px solid var(--line);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);padding:8px 14px;border-radius:99px;font:500 13px Outfit,sans-serif;cursor:pointer;white-space:nowrap;transition:transform .25s var(--ease),box-shadow .25s}
button.chip:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(30,40,60,.1)}
button.chip:active{transform:scale(.95)}
.btn:active,.tabs button:active,.seg button:active{transform:scale(.96)}
.btn:focus-visible,button.chip:focus-visible{outline:2px solid var(--b);outline-offset:3px}
button.chip.ico{padding:8px 10px;display:grid;place-items:center}
.tg{transition:transform .7s var(--spring)}
.sp{flex:1}

/* ---------- Tipografia e cartões ---------- */
h1{font:500 30px Fraunces,Georgia,serif;margin:22px 0 2px;letter-spacing:-.4px}
.lh1{font-size:26px;margin:14px 0 4px}
.sub{color:var(--mute);margin:0 0 16px;max-width:64ch;line-height:1.5}
.grid{display:grid;gap:12px}.k4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 8px 28px rgba(30,40,60,.08)}
.card h3{margin:0 0 10px;font-size:13px;font-weight:500;color:var(--mute);display:flex;align-items:center;gap:7px}
.big{font-size:30px;font-variant-numeric:tabular-nums}.d{font-size:12px;margin-left:6px;color:var(--mute)}.cap{font-size:11px;color:var(--mute);margin-top:6px}
.cnt{font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.cn{margin-left:auto;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--hair);color:var(--ink)}
.spark{display:flex;align-items:flex-end;gap:3px;height:42px;margin-top:10px}
.spark i{flex:1;background:linear-gradient(var(--o),var(--y));border-radius:2px;min-height:3px}
.bar{height:8px;border-radius:9px;background:var(--hair);overflow:hidden;margin:8px 0}.bar b{display:block;height:100%;background:var(--g);border-radius:9px}
.stack{display:flex;height:22px;border-radius:7px;overflow:hidden;margin:10px 0 8px;gap:2px}.stack i{display:block;min-width:2px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mute);font-size:12px}.leg b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.cost-chart{display:grid;gap:14px;margin-top:12px}.cost-row{display:grid;grid-template-columns:minmax(90px,150px) minmax(120px,1fr) minmax(95px,auto);align-items:center;gap:12px;animation:chartRowIn .55s var(--ease) both;animation-delay:calc(var(--chart-index,0)*90ms)}.cost-name{overflow-wrap:anywhere}.cost-track{height:18px;display:flex;background:var(--hair);border-radius:4px;overflow:hidden}.cost-track i{height:100%;min-width:0;transform-origin:left center;animation:chartGrow .85s var(--ease) both;animation-delay:calc(var(--chart-index,0)*90ms + 130ms)}.cost-track .paid{background:#70B88B}.cost-track .open{background:#E9C270}.cost-track .payroll{background:#91AFC7}.cost-value{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.ai-summary{white-space:pre-line;line-height:1.65;margin:0;color:var(--ink)}
.dash-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-2px 0 14px;color:var(--mute);font-size:12px}.dash-charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px;margin-top:12px}.dash-bars{display:grid;gap:12px;margin-top:14px}.dash-bar-row{display:grid;grid-template-columns:minmax(90px,132px) minmax(60px,1fr) minmax(88px,auto);align-items:center;gap:10px;font-size:12px}.dash-bar-name{color:var(--mute)}.dash-track{height:12px;overflow:hidden;border-radius:99px;background:var(--hair)}.dash-track i{display:block;height:100%;width:var(--bar-width);min-width:2px;border-radius:inherit;background:var(--bar-color);transition:width .45s var(--ease)}.dash-bar-value{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.attendance-chart{display:grid;grid-template-columns:repeat(14,minmax(8px,1fr));align-items:end;gap:5px;height:128px;margin-top:14px;padding-top:8px;border-bottom:1px solid var(--hair)}.attendance-column{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;min-width:0}.attendance-column i{display:block;width:min(100%,18px);height:var(--bar-height);min-height:3px;border-radius:5px 5px 2px 2px;background:var(--b);transition:height .4s var(--ease)}.attendance-column small{font-size:9px;color:var(--mute);white-space:nowrap}.dash-alerts{display:grid;gap:8px;margin-top:12px}.dash-alert{display:grid;grid-template-columns:9px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--inp);color:var(--ink);text-align:left;font:inherit;cursor:pointer;transition:border-color .2s,transform .2s}.dash-alert:hover{transform:translateY(-1px);border-color:var(--hair)}.dash-alert .dot{background:var(--o)}.dash-alert.critico .dot{background:var(--r)}.dash-alert strong{display:block;font-size:12px;font-weight:600}.dash-alert small{display:block;margin-top:2px;color:var(--mute);font-size:11px}.dash-alert-empty{padding:14px;border-radius:12px;background:rgba(91,155,119,.1);color:var(--g);font-size:13px}
.search-overlay{position:fixed;inset:0;z-index:20;display:grid;align-items:start;justify-items:center;padding:12vh 14px 20px;background:rgba(15,22,18,.55);backdrop-filter:blur(5px)}.search-overlay[hidden]{display:none}.search-dialog{width:min(620px,100%);max-height:72vh;overflow:auto;padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 24px 80px rgba(0,0,0,.24)}.search-results{display:grid;gap:6px;margin-top:12px}.search-result{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:46px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--inp);color:var(--ink);text-align:left;font:inherit;cursor:pointer}.search-result small{color:var(--mute)}.offline-indicator{font-size:11px;color:var(--mute)}
.task[draggable=true]{cursor:grab}.task.dragging{opacity:.42}.kan-column.drop-target{outline:2px dashed var(--b);outline-offset:3px}.task-modal-overlay{position:fixed;inset:0;z-index:22;display:grid;place-items:center;padding:16px;background:rgba(15,22,18,.58);backdrop-filter:blur(5px)}.task-modal-overlay[hidden]{display:none}.task-dialog{width:min(760px,100%);max-height:88vh;overflow:auto;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 24px 80px rgba(0,0,0,.26)}.task-dialog h2{margin:0}.task-modal-head{display:flex;align-items:start;justify-content:space-between;gap:12px}.task-checklist{display:grid;gap:7px;margin:10px 0}.task-checkline{display:flex;align-items:center;gap:8px}.task-history{display:grid;gap:9px;max-height:210px;overflow:auto}.task-history article{border-left:2px solid var(--hair);padding:4px 9px}.task-history small{display:block;color:var(--mute);margin-top:2px}.task-tags{display:flex;flex-wrap:wrap;gap:5px}.kan-column{min-height:80px}.board-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.saved-filter{display:flex;gap:6px;align-items:center}.board-print h1{margin-top:0}
.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.month-cell{min-height:96px;padding:7px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.month-cell.other{opacity:.45}.month-cell.today{border-color:var(--g)}.month-cell>small{display:block;color:var(--mute);margin-bottom:5px}.booking-chip{display:block;margin:3px 0;padding:4px 5px;border-radius:6px;background:rgba(120,182,148,.16);font-size:10px;overflow-wrap:anywhere}.weekday{font-size:11px;color:var(--mute);text-align:center}
@media(max-width:480px){.dash-toolbar{flex-wrap:wrap}.dash-charts{grid-template-columns:minmax(0,1fr)}.dash-bar-row{grid-template-columns:minmax(76px,92px) minmax(32px,1fr) minmax(76px,auto);gap:7px;font-size:11px}.dash-bar-value{font-size:11px}}
@keyframes chartRowIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes chartGrow{from{transform:scaleX(.03);opacity:.45}to{transform:scaleX(1);opacity:1}}
.gauge{display:block;margin:0 auto;max-width:210px;width:100%}
table{width:100%;border-collapse:collapse}th{text-align:left;font-weight:500;color:var(--mute);font-size:12px;padding:6px 8px}td{padding:9px 8px;border-top:1px solid var(--hair);transition:background-color .25s}.tw{overflow-x:auto}
tr:hover>td{background:rgba(120,182,148,.1)}
.tag{padding:2px 9px;border-radius:99px;font-size:11px;background:rgba(91,155,119,.16);color:#477D5D;transition:background-color .4s,color .4s}.tag.w{background:rgba(233,194,112,.24);color:#8A6A2D}.tag.x{background:rgba(207,119,113,.16);color:#A85450}
.btn{position:relative;background:var(--y);border:0;color:var(--btn-ink);padding:9px 16px;border-radius:99px;font:600 13px Outfit,sans-serif;cursor:pointer;transition:transform .25s var(--ease),box-shadow .3s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(94,157,124,.25)}
.btn:active{transform:scale(.97)}
.btn.l{width:100%;padding:15px;font-size:16px;margin-top:12px}
.busy{pointer-events:none;color:transparent!important}
.busy:after{content:"";position:absolute;inset:0;margin:auto;width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.28);border-top-color:#fff;animation:spin .7s linear infinite}
.chip.busy:after{border-color:var(--hair);border-top-color:var(--ink)}
@keyframes spin{to{transform:rotate(360deg)}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
input,select{font:inherit;color:var(--ink);background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:70px;transition:border-color .25s,box-shadow .25s,background-color .5s}
textarea{font:inherit;color:var(--ink);background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:92px;resize:vertical}
input:focus,select:focus{outline:0;border-color:var(--y);box-shadow:0 0 0 4px rgba(94,157,124,.18)}
textarea:focus{outline:0;border-color:var(--y);box-shadow:0 0 0 4px rgba(94,157,124,.18)}
input[type=checkbox]{accent-color:var(--y)}
label{display:block;color:var(--mute);font-size:12px;margin:10px 0 4px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.row>*{flex:1}.row>.btn{flex:none}
.empty p{margin:0 0 4px;color:var(--mute)}
.message-list{display:grid;gap:9px;max-height:52vh;overflow:auto;padding:2px 4px 2px 0}
.message-item{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--inp);overflow-wrap:anywhere}
.message-meta{display:flex;justify-content:space-between;gap:10px;color:var(--mute);font-size:11px;margin-bottom:5px}
.message-item p{margin:0;white-space:pre-wrap;line-height:1.5}

/* ---------- Primeiros passos ---------- */
.steps{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.steps li{display:flex;align-items:center;gap:10px;color:var(--mute)}
.steps li.done{color:var(--ink)}
.steps button{all:unset;display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:8px}
.steps button:hover .st{color:var(--ink);transform:translateX(3px)}.st{transition:transform .3s var(--ease),color .3s}
.steps button:focus-visible{outline:2px solid var(--b);outline-offset:3px}
.ck{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--hair);display:grid;place-items:center;transition:background-color .3s,border-color .3s}
.done .ck{background:var(--g);border-color:var(--g)}
.ck svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:16;stroke-dashoffset:16}
.done .ck svg{stroke-dashoffset:0}

/* ---------- Quadros ---------- */
.kan{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;align-items:start}
.task{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--tc,var(--hair));border-radius:12px;padding:11px;margin-top:8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;transition:transform .3s var(--ease),box-shadow .3s}
.task:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(30,40,60,.12)}
.task:active{transform:scale(.98)}
.task small{color:var(--mute);display:block;margin-top:4px}
.task.done b{opacity:.55;text-decoration:line-through;text-decoration-thickness:1px}
.x{all:unset;cursor:pointer;color:var(--mute);padding:0 6px;font-size:16px;line-height:1;transition:color .2s,transform .3s var(--spring)}.x:hover{color:var(--r);transform:scale(1.3)}.x:focus-visible{outline:2px solid var(--b)}
.none{border:1.5px dashed var(--hair);border-radius:12px;padding:16px;text-align:center;color:var(--mute);margin-top:8px}

/* ---------- Mensagens, ponto ao vivo e comprovante ---------- */
.login{min-height:90vh;display:grid;place-items:center}.lc{width:100%;max-width:380px}.login-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.theme-toggle{width:40px;height:40px;padding:0;font-size:18px}
.boot-screen{min-height:90vh;display:grid;place-items:center}.boot-content{display:grid;justify-items:center;gap:16px;text-align:center}.boot-content .logo{font-size:28px}.boot-spinner{width:28px;height:28px;border:2px solid var(--hair);border-top-color:var(--y);border-radius:50%;animation:spin .8s linear infinite}.boot-label{margin:0;color:var(--mute);font-size:13px}.account-link{margin-top:14px;width:100%;min-height:44px}
.lc.signup-card{max-width:540px}
.login-tools{display:flex;align-items:center;gap:8px}.motion-control{display:flex;align-items:center;gap:7px;min-height:40px;padding:8px 10px;margin:0;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--mute);font-size:12px;white-space:nowrap;cursor:pointer}.motion-control input{width:16px;min-width:16px;height:16px;margin:0;accent-color:var(--y)}
.msg{padding:12px;border-radius:12px;margin-top:12px;font-weight:500;transition:background-color .4s,color .4s}
.msg.in,.fi{animation:fi .55s var(--ease) backwards}
@keyframes fi{from{opacity:0;transform:translateY(10px)}}
.fo{opacity:0;transform:translateY(6px);transition:opacity .15s,transform .15s}
.ok{background:rgba(40,167,69,.18);color:var(--g)}.no{background:rgba(220,53,69,.15);color:var(--r)}
.dotp{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:8px;position:relative}
.dotp:after{content:"";position:absolute;inset:0;border-radius:50%;background:currentColor;animation:ping 1.7s ease-out infinite}
.msg.no .dotp:after{display:none}
@keyframes ping{to{transform:scale(3);opacity:0}}
.meter{height:6px;border-radius:9px;background:rgba(120,130,150,.25);overflow:hidden;margin-top:9px}
.meter b{display:block;height:100%;width:0;border-radius:9px;background:currentColor;transition:width .9s var(--ease)}
.okc{display:block;width:68px;height:68px;margin:14px auto 2px;animation:okpop .6s var(--spring) backwards}
@keyframes okpop{from{transform:scale(.5);opacity:0}}
.okc circle{fill:rgba(40,167,69,.14);stroke:var(--g);stroke-width:2.5;stroke-dasharray:146;stroke-dashoffset:146;animation:dr .7s var(--ease) forwards}
.okc path{fill:none;stroke:var(--g);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:dr .45s var(--ease) .5s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.ticket{animation:rise .8s var(--ease) .3s backwards}
.ticket .ln{animation:rise .6s var(--ease) backwards;animation-delay:calc(.55s + var(--i,0)*90ms);line-height:1.7}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,26px) scale(.95);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;z-index:9;max-width:90vw;display:flex;align-items:center;gap:10px;box-shadow:0 12px 32px rgba(0,0,0,.25);transition:opacity .35s,transform .55s var(--spring)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.td{width:9px;height:9px;border-radius:50%;background:var(--y);flex:none}.td.ok{background:var(--g)}.td.no{background:var(--r)}

/* ---------- Entrada das telas ---------- */
main.leave{animation:leave .21s ease-in forwards}
@keyframes leave{to{opacity:0;transform:translate3d(calc(var(--dir,0)*-30px),-6px,0)}}
.rise{animation:rise .75s var(--ease) backwards;animation-delay:calc(var(--i,0)*70ms + 40ms)}
@keyframes rise{from{opacity:0;transform:translate3d(calc(var(--dir,0)*36px),20px,0) scale(.985)}}
.animate .spark i{transform-origin:bottom;animation:grow .8s var(--ease) backwards;animation-delay:calc(var(--k,0)*35ms + 320ms)}
@keyframes grow{from{transform:scaleY(0)}}
.animate .bar b{transform-origin:left;animation:sx 1.1s var(--ease) .4s backwards}
@keyframes sx{from{transform:scaleX(0)}}
.animate .stack{animation:reveal 1.1s var(--ease) .4s backwards}
@keyframes reveal{from{clip-path:inset(0 100% 0 0 round 7px)}to{clip-path:inset(0 0 0 0 round 7px)}}
.animate .gfill{animation:gdraw 1.4s var(--ease) .3s backwards}
@keyframes gdraw{from{stroke-dasharray:0 100}}
.animate .done .ck{animation:pop .5s var(--spring) backwards;animation-delay:calc(.5s + var(--k,0)*.12s)}
.animate .done .ck svg{animation:dr2 .5s var(--ease) backwards;animation-delay:calc(.6s + var(--k,0)*.12s)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes dr2{from{stroke-dashoffset:16}}
.animate tr{animation:rowIn .6s var(--ease) backwards;animation-delay:calc(var(--r,0)*40ms + 350ms)}
@keyframes rowIn{from{opacity:0;transform:translateX(-10px)}}
.flash{animation:flash 1.3s ease-out}
@keyframes flash{from{background-color:rgba(120,182,148,.25)}}
.sk{height:110px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(100deg,var(--card) 30%,var(--shine) 50%,var(--card) 70%) 0 0/220% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-220% 0}}

@media (prefers-reduced-motion:reduce){:root:not([data-motion=full]) *, :root:not([data-motion=full]) *::before, :root:not([data-motion=full]) *::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}:root:not([data-motion=full]) .orbs i{will-change:auto}}
:root[data-motion=reduced] *, :root[data-motion=reduced] *::before, :root[data-motion=reduced] *::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
@media print{.orbs,nav,#toast,.noprint,.seg,.task-modal-overlay,.search-overlay{display:none!important}body{background:#fff;color:#000}#root{max-width:none;padding:0}.card{background:#fff;box-shadow:none;border:1px solid #ccc;backdrop-filter:none}.task{break-inside:avoid}}
.salary-compact,#es{max-width:115px;min-width:80px!important;padding:6px 8px!important;margin:0!important}.salary-row{margin:4px 0!important;padding:0!important}.business-field{flex:1 1 180px;min-width:0}.business-field input,.business-field select{width:100%;box-sizing:border-box}.card details summary{cursor:pointer;font-weight:600}.card label input[type=file]{max-width:220px}
</style><link rel="stylesheet" href="/enhancements.css">
</head><body>
<div class="orbs" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="root"><div class="boot-screen" role="status" aria-label="Carregando SIGI"><div class="boot-content"><div class="logo"><i class="mk"></i>SIGI</div><span class="boot-spinner" aria-hidden="true"></span><p class="boot-label">Preparando seu espaço de trabalho…</p></div></div></div><div id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),R=v=>'R$ '+(+v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wait=ms=>new Promise(r=>setTimeout(r,ms)),still=()=>{const mode=document.documentElement.dataset.motion;return mode==='reduced'||(mode!=='full'&&matchMedia('(prefers-reduced-motion: reduce)').matches)};
let TOKEN=null,ROLE='admin',CURRENT_NAME='',CURRENT_USER='';try{TOKEN=sessionStorage.getItem('tk');ROLE=sessionStorage.getItem('role')||'admin';CURRENT_NAME=sessionStorage.getItem('name')||'';CURRENT_USER=sessionStorage.getItem('user')||''}catch(e){}
const S={tab:'painel',mode:'g',board:'kan',q:'',filt:'',filterStatus:'',filterPriority:'',filterApproval:'',messageTarget:'team'};let P=[];
const fmt={R:v=>R(v),p:v=>Math.round(v)+'%',q:v=>(Math.round(v*10)/10).toLocaleString('pt-BR')+'%',i:v=>String(Math.round(v)),h:v=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:1})};
const cnt=(v,f)=>`<span class="cnt" data-v="${+v||0}" data-f="${f}">${fmt[f](+v||0)}</span>`;

/* ---------- Utilidades de movimento ---------- */
function toast(t,k){const e=$('#toast');e.innerHTML=`<i class="td ${k||''}"></i><span>${esc(t)}</span>`;
 if(e.classList.contains('show')&&!still())e.animate([{transform:'translate(-50%,0) scale(.95)'},{transform:'translate(-50%,0) scale(1)'}],{duration:260,easing:'cubic-bezier(.34,1.56,.64,1)'});
 e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),3500)}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');el.addEventListener('animationend',()=>el.classList.remove('shake'),{once:true})}
function tween(el,from,to,ms){const fm=fmt[el.dataset.f];if(still()||from===to){el.textContent=fm(to);return}
 const t0=performance.now(),e=t=>t>=1?1:1-Math.pow(2,-10*t),step=n=>{const p=Math.min(1,(n-t0)/ms);el.textContent=fm(from+(to-from)*e(p));if(p<1)requestAnimationFrame(step)};
 el.textContent=fm(from);requestAnimationFrame(step)}
async function gone(el){if(!el||still())return;const row=el.tagName=='TR',h=el.offsetHeight;el.style.overflow='hidden';
 const k=row?[{opacity:1,transform:'none'},{opacity:0,transform:'translateX(30px)'}]:[{opacity:1,transform:'none',maxHeight:h+'px'},{opacity:0,transform:'translateX(36px) scale(.96)',maxHeight:'0px',marginTop:'0px',paddingTop:'0px',paddingBottom:'0px',borderWidth:'0px'}];
 try{await el.animate(k,{duration:row?260:380,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}).finished}catch(e){}}
function placePill(box,instant){const pill=box&&box.querySelector('.pill'),on=box&&box.querySelector('button.on');if(!pill||!on)return;
 if(instant)pill.style.transition='none';
 pill.style.width=on.offsetWidth+'px';pill.style.transform=`translateX(${on.offsetLeft}px)`;
 if(instant){void pill.offsetWidth;pill.style.transition=''}}
const placeAll=i=>document.querySelectorAll('.tabs,.seg').forEach(b=>placePill(b,i));
addEventListener('resize',()=>placeAll(true));document.fonts&&document.fonts.ready.then(()=>placeAll(true));

const offlineDB=()=>new Promise((resolve,reject)=>{const request=indexedDB.open('sigi-offline',1);request.onupgradeneeded=()=>{request.result.createObjectStore('responses',{keyPath:'key'});request.result.createObjectStore('outbox',{keyPath:'id',autoIncrement:true})};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});
async function offlineValue(store,mode,operation){const db=await offlineDB();return new Promise((resolve,reject)=>{const tx=db.transaction(store,mode),result=operation(tx.objectStore(store));tx.oncomplete=()=>{db.close();resolve(result)};tx.onerror=()=>{db.close();reject(tx.error)}})}
const offlineOwner=()=>ROLE+':'+(CURRENT_NAME||'session');
async function rememberOffline(path,value){await offlineValue('responses','readwrite',store=>store.put({key:offlineOwner()+':'+path,owner:offlineOwner(),path,value}))}
async function cachedOffline(path){const db=await offlineDB();return new Promise((resolve,reject)=>{const tx=db.transaction('responses','readonly'),request=tx.objectStore('responses').get(offlineOwner()+':'+path);request.onsuccess=()=>{db.close();resolve(request.result?.value)};request.onerror=()=>{db.close();reject(request.error)}})}
function isQueueable(path,method){return ['PUT','PATCH','DELETE'].includes(method)&&(/^\/tasks\/\d+(\/approval|\/status\/\d+)?$/.test(path)||/^\/materials\/\d+$/.test(path))}
async function api(path,method='GET',body){
 method=method.toUpperCase();
 let r;
 try{r=await fetch(path,{method,headers:{'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})},body:body?JSON.stringify(body):undefined})}
 catch(error){
  if(method==='GET'&&['/tasks','/materials'].includes(path)){const cached=await cachedOffline(path);toast('Modo offline: exibindo dados sincronizados anteriormente.','w');return cached??[]}
  if(isQueueable(path,method)){
   await offlineValue('outbox','readwrite',store=>store.add({owner:offlineOwner(),path,method,body:body||null,createdAt:Date.now()}));
   toast('Sem conexão: alteração guardada neste dispositivo e será sincronizada ao reconectar.','w');return {queued:true}
  }
  throw error
 }
 const j=await r.json().catch(()=>({}));
 if(r.status==401&&TOKEN&&path!='/auth/login'){sair(true);throw new Error(j.detail||'Sessão expirada.')}
 if(!r.ok)throw new Error(Array.isArray(j.detail)?'Confira os dados informados.':(typeof j.detail==='object'?j.detail.message:(j.detail||'Erro inesperado.')));
 if(method==='GET'&&['/tasks','/materials'].includes(path))try{await rememberOffline(path,j)}catch(error){console.error('Não foi possível atualizar o cache offline:',error)}
 return j}
async function syncOfflineQueue(){if(!navigator.onLine||!TOKEN)return;const db=await offlineDB(),items=await new Promise((resolve,reject)=>{const tx=db.transaction('outbox','readonly'),request=tx.objectStore('outbox').getAll();request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});db.close();let count=0;
 for(const item of items.filter(entry=>entry.owner===offlineOwner()).sort((a,b)=>a.id-b.id)){
  const response=await fetch(item.path,{method:item.method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:item.body?JSON.stringify(item.body):undefined});
  let alreadyApplied=false;
  if(response.status===409&&/\/tasks\/\d+\/approval$/.test(item.path)){const taskId=Number(item.path.split('/')[2]),tasks=await api('/tasks');alreadyApplied=tasks.some(task=>task.id===taskId&&task.approval===item.body?.decision)}
  if(!response.ok&&!alreadyApplied){const detail=await response.json().catch(()=>({}));toast(`Sincronização interrompida: ${detail.detail||'a alteração foi recusada pelo servidor.'}`,'no');return}
  await offlineValue('outbox','readwrite',store=>store.delete(item.id));count++
 }
 if(count){toast(`${count} alteração(ões) offline sincronizada(s).`,'ok');for(const path of ['/tasks','/materials'])await offlineValue('responses','readwrite',store=>store.delete(offlineOwner()+':'+path));if(S.tab==='quadros'||S.tab==='materia')refresh()}
}
const run=async(f,btn)=>{if(btn){if(btn.classList.contains('busy'))return;btn.classList.add('busy')}
 try{await f()}catch(e){toast(e.message,'no');if(btn&&btn.isConnected)shake(btn)}finally{if(btn&&btn.isConnected)btn.classList.remove('busy')}};
function sair(local){stopDashboardRefresh();if(!local)api('/auth/logout','POST').catch(()=>{});TOKEN=null;ROLE='admin';CURRENT_NAME='';try{sessionStorage.removeItem('tk');sessionStorage.removeItem('role');sessionStorage.removeItem('name')}catch(e){}tela()}
function pos(){return new Promise((ok,er)=>{if(!navigator.geolocation)return er(new Error('Seu navegador não tem localização.'));navigator.geolocation.getCurrentPosition(ok,()=>er(new Error('Ative o GPS e permita o acesso à localização.')),{enableHighAccuracy:true,timeout:15000})})}
function themeButton(){const dark=document.documentElement.dataset.theme=='dark';return `<button class="chip ico theme-toggle" type="button" onclick="toggleTheme()" aria-label="Alternar tema claro ou escuro" aria-pressed="${dark}" title="Alternar tema">${dark?'☼':'☾'}</button>`}
function syncThemeButtons(){document.querySelectorAll('.theme-toggle').forEach(button=>{const dark=document.documentElement.dataset.theme=='dark';button.textContent=dark?'☼':'☾';button.setAttribute('aria-pressed',String(dark))})}
function toggleTheme(){const root=document.documentElement;root.classList.add('tt');const next=root.dataset.theme=='dark'?'light':'dark';root.dataset.theme=next;try{localStorage.setItem('theme',next)}catch(e){}syncThemeButtons();clearTimeout(toggleTheme.timer);toggleTheme.timer=setTimeout(()=>root.classList.remove('tt'),550)}
function motionButton(){return `<label class="motion-control" title="Ativar ou reduzir animações"><input type="checkbox" ${still()?'':'checked'} onchange="toggleMotion(this.checked)"><span>Animações</span></label>`}
function syncMotionButtons(){document.querySelectorAll('.motion-control input').forEach(input=>input.checked=!still())}
function toggleMotion(enabled){const root=document.documentElement;root.dataset.motion=enabled?'full':'reduced';try{localStorage.setItem('motion',root.dataset.motion)}catch(e){}syncMotionButtons();if(enabled){const main=$('#main'),loginCard=$('.login .view');if(main){main.classList.remove('animate');main.querySelectorAll('.rise').forEach(item=>item.classList.remove('rise'));void main.offsetWidth;play(main,0)}else if(loginCard){loginCard.classList.remove('view');void loginCard.offsetWidth;loginCard.classList.add('view')}}}

/* ---------- Troca de tela raiz (login ⇄ painel) ---------- */
let SWAP=0;
async function swapRoot(html){const id=++SWAP,root=$('#root'),old=root.firstElementChild;
 if(old&&!still()){old.classList.add('out');await wait(180)}
 if(id!==SWAP)return false;root.innerHTML=html;return true}

/* ---------- Login / Ponto do funcionário (localização em tempo real) ---------- */
let W=null,BUF=[],LAST=0,FILL=0,CLOCK_TASK_BY_EMPLOYEE={};
function stopWatch(){if(W!=null&&navigator.geolocation)navigator.geolocation.clearWatch(W);W=null;BUF=[]}
function tela(){stopWatch();return TOKEN?(ROLE=='employee'?employeeApp():app()):login()}
async function login(){stopWatch();S.mode='g';
 if(!await swapRoot(`<div class="login"><div class="card lc view"><div class="login-head"><div class="logo"><i class="mk"></i>SIGI</div><div class="login-tools">${themeButton()}</div></div>
 <p id="loginCompany" class="login-company"></p><div id="lh"><h1 id="lt" class="lh1"></h1><p class="sub" id="lsub"></p></div>
 <div id="seg" hidden></div><div id="lf"></div><div id="accountShortcut"></div><div id="live" class="msg" style="display:none"></div><div id="lm" aria-live="polite"></div></div></div>`))return;
 placeAll(true);await fillMode(true)}
async function setMode(m){if(S.mode==m)return;S.mode=m;stopWatch();await fillMode()}
function clearLoginError(input){input.removeAttribute('aria-invalid');const target=$('#'+input.id+'-error');if(target)target.textContent='';if($('#loginError'))$('#loginError').textContent=''}
function togglePassword(){const input=$('#ls'),button=$('#passwordToggle'),show=input.type==='password';input.type=show?'text':'password';button.textContent=show?'Ocultar':'Mostrar';button.setAttribute('aria-pressed',String(show))}
const formG=`<form id="signInForm" onsubmit="event.preventDefault();entrar()" novalidate><label for="lu">E-mail ou usuário</label><input id="lu" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="lu-error" oninput="clearLoginError(this)"><small id="lu-error" class="field-error" role="alert"></small><label for="ls">Senha</label><div class="password-field"><input id="ls" type="password" autocomplete="current-password" aria-describedby="ls-error" oninput="clearLoginError(this)"><button id="passwordToggle" type="button" aria-pressed="false" onclick="togglePassword()">Mostrar</button></div><small id="ls-error" class="field-error" role="alert"></small><div id="otpFields"></div><p id="loginError" class="field-error" role="alert"></p><button class="btn l" type="submit">Entrar</button></form>`;
const formP=E=>E.length?`<label for="le">Seu nome</label><select id="le" onchange="restoreClockTask()">${E.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select><label for="lp">PIN</label><input id="lp" type="password" inputmode="numeric" maxlength="8" autocomplete="off" onkeydown="if(event.key=='Enter')run(baterPonto,$('#lf .btn'))"><div class="row"><select id="clockTask" aria-label="Tarefa para contabilizar horas"><option value="">Sem vínculo com tarefa</option></select><button class="chip" type="button" onclick="run(loadClockTasks,this)">Carregar tarefas</button></div>
  <label style="display:flex;gap:8px;align-items:flex-start;color:var(--ink);margin-top:14px"><input id="lc" type="checkbox" style="width:auto;min-width:0;margin-top:2px"><span>Autorizo o uso da localização deste aparelho somente enquanto registro o ponto.</span></label>
  <button class="btn l" onclick="run(baterPonto,this)">Registrar ponto</button>`:`<p class="sub" style="margin-top:14px">Nenhum funcionário cadastrado ainda. Peça ao gestor para cadastrar você.</p>`;
function restoreClockTask(){const select=$('#clockTask');if(select)select.value=CLOCK_TASK_BY_EMPLOYEE[$('#le')?.value]||''}
async function loadClockTasks(){const employee_id=+$('#le')?.value,pin=$('#lp')?.value;if(!employee_id||!pin)return toast('Escolha seu nome e digite o PIN primeiro.','no');const tasks=await api(`/clock/tasks?employee_id=${employee_id}&pin=${encodeURIComponent(pin)}`),select=$('#clockTask'),previous=CLOCK_TASK_BY_EMPLOYEE[employee_id]||select.value;select.innerHTML='<option value="">Sem vínculo com tarefa</option>'+tasks.map(task=>`<option value="${task.id}">${esc(task.title)}</option>`).join('');if(previous&&tasks.some(task=>task.id===+previous))select.value=String(previous);toast(tasks.length?`${tasks.length} tarefa(s) em andamento carregada(s).`:'Nenhuma tarefa em andamento para vincular.','ok')}
async function fillMode(first){const id=++FILL,publicClock=S.mode==='p';
 if(!$('#lf'))return;
 const [status,brand]=await Promise.all([api('/auth/status'),api('/auth/branding')]);
 if(id!==FILL||!$('#lf'))return;
 $('#root .lc').classList.remove('signup-card');$('#loginCompany').textContent=brand.name||'Gestão integrada da sua equipe';
 $('#lt').textContent=publicClock?'Bater ponto':status.setup_required?'Comece por aqui':'Bem-vindo de volta';
 $('#lsub').textContent=publicClock?'Selecione seu nome e registre o ponto com seu PIN.':status.setup_required?'Crie o primeiro acesso da sua empresa.':'Entre para acompanhar seu dia.';
 $('#lm').innerHTML='';$('#live').style.display='none';
 $('#lf').innerHTML=publicClock?'<p class="sub" role="status">Carregando funcionários…</p>':status.setup_required?'<button class="btn l" onclick="run(startRegistration,this)">Criar primeira conta da empresa</button>':formG;
 $('#accountShortcut').innerHTML=publicClock?`<button class="chip login-shortcut" onclick="setMode('g')">Voltar ao acesso</button>`:status.setup_required?'':`<div class="login-shortcuts"><button class="chip login-shortcut" onclick="setMode('p')">Bater ponto</button><button class="account-link" onclick="run(startRegistration,this)">Criar conta da empresa</button></div>`;
 if(publicClock){try{const employees=await api('/clock/employees');if(id!==FILL||!$('#lf'))return;$('#lf').innerHTML=formP(employees);restoreClockTask()}catch(error){if(id===FILL)$('#lf').innerHTML=`<p class="field-error" role="alert">${esc(error.message)}</p><button class="chip" onclick="fillMode()">Tentar novamente</button>`}}
}
function registrationFields(initial,company={}){const locked=company.name?'readonly':'';return `<div class="grid g2"><div><label for="ruser">Nome de usuário do administrador</label><input id="ruser" autocomplete="name" maxlength="80" required></div><div><label for="rg">E-mail de acesso</label><input id="rg" type="email" autocomplete="email" maxlength="254" placeholder="voce@empresa.com" required></div><div><label for="rp">Senha (mínimo 8 caracteres)</label><input id="rp" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></div><div><label for="rc">Confirmar senha</label><input id="rc" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></div><div><label for="rco">Nome da empresa (opcional)</label><input id="rco" value="${esc(company.name||'')}" minlength="2" maxlength="160" ${locked}></div><div><label for="rcnpj">CNPJ (opcional, 14 números)</label><input id="rcnpj" inputmode="numeric" maxlength="14" value="${esc(company.cnpj||'')}" ${locked}></div></div><div class="row"><button class="btn" onclick="run(()=>submitRegistration(${initial}),this)">${initial?'Criar conta e entrar':'Criar acesso'}</button>${initial?'<button class="chip" onclick="login()">Voltar ao login</button>':''}</div><p id="register-result" class="sub" aria-live="polite"></p>`}

 return `<div class="dash-alerts" role="list">${alerts.map(alert=>`<button class="dash-alert ${alert.severity}" role="listitem" onclick="go('${alert.tab}')"><i class="dot" aria-hidden="true"></i><span><strong>${esc(alert.title)}</strong><small>${esc(alert.detail)}</small></span><span aria-hidden="true">›</span></button>`).join('')}</div>`
}

const boardFilterKey=()=>`sigi-board-filters:${CURRENT_NAME||'session'}`;
function savedBoardFilters(){try{return JSON.parse(localStorage.getItem(boardFilterKey())||'[]')}catch(error){console.error('Filtros salvos inválidos:',error);return []}}
function boardFilterState(){return {q:S.q||'',severity:S.filt||'',status:S.filterStatus||'',priority:S.filterPriority||'',approval:S.filterApproval||'',department:S.filterDepartment||''}}
function saveBoardFilter(){const name=$('#filterName')?.value.trim();if(!name)return toast('Dê um nome para esta combinação de filtros.','no');const list=savedBoardFilters();list.push({name,filters:boardFilterState()});try{localStorage.setItem(boardFilterKey(),JSON.stringify(list));toast('Filtro salvo neste dispositivo.','ok');refresh()}catch(error){toast('Não foi possível salvar este filtro no navegador.','no')}}
function applyBoardFilter(index){const saved=savedBoardFilters()[Number(index)];if(!saved)return;Object.assign(S,{q:saved.filters.q||'',filt:saved.filters.severity||'',filterStatus:saved.filters.status||'',filterPriority:saved.filters.priority||'',filterApproval:saved.filters.approval||'',filterDepartment:saved.filters.department||''});refresh()}
function startTaskDrag(event,id){if(ROLE!=='admin')return;DRAG_TASK=id;event.dataTransfer.setData('text/plain',String(id));event.dataTransfer.effectAllowed='move';event.currentTarget.classList.add('dragging')}
function dragOverColumn(event){event.preventDefault();event.currentTarget.classList.add('drop-target');event.dataTransfer.dropEffect='move'}
function leaveColumn(event){if(!event.currentTarget.contains(event.relatedTarget))event.currentTarget.classList.remove('drop-target')}
async function dropTask(event,status){event.preventDefault();event.currentTarget.classList.remove('drop-target');const id=Number(event.dataTransfer.getData('text/plain'))||DRAG_TASK;if(id)await run(()=>mv(id,status));DRAG_TASK=null}
async function downloadBoardCsv(){const values={q:S.q||'',status:S.filterStatus||'',priority:S.filterPriority||'',severity:S.filt||'',approval:S.filterApproval||'',department_id:S.filterDepartment||''},params=new URLSearchParams(Object.entries(values).filter(([,value])=>value!=='')),response=await fetch('/tasks/export.csv?'+params,{headers:{Authorization:'Bearer '+TOKEN}});if(!response.ok)throw new Error('Não foi possível exportar o quadro.');const url=URL.createObjectURL(await response.blob()),link=document.createElement('a');link.href=url;link.download='quadros.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
TAB.quadros=quadros;
async function quadros(){
 const [T,departments,rules]=await Promise.all([api('/tasks'),ROLE==='admin'?api('/departments'):Promise.resolve([]),ROLE==='admin'?api('/automations'):Promise.resolve([])]),C=[['A fazer','var(--o)','Nenhuma tarefa pendente.'],['Em andamento','var(--b)','Nada em andamento agora.'],['Concluído','var(--g)','Nada concluído ainda.']];
 const q=(S.q||'').toLowerCase(),saved=savedBoardFilters();
 const L0=T.filter(t=>(!q||t.title.toLowerCase().includes(q)||(t.assignee||'').toLowerCase().includes(q))&&(!S.filt||t.severity===S.filt)&&(!S.filterStatus||String(t.status)===S.filterStatus)&&(!S.filterPriority||t.priority===S.filterPriority)&&(!S.filterApproval||t.approval===S.filterApproval)&&(!S.filterDepartment||String(t.department_id||'')===S.filterDepartment));
 if(ROLE!=='admin')return `<h1>Quadros</h1><p class="sub">Tarefas operacionais. Abra um card para ver checklist, anexos e histórico; gestores podem decidir aprovações pendentes.</p><div class="board-tools noprint"><button class="chip" onclick="run(downloadBoardCsv)">Exportar CSV / Excel</button><button class="chip" onclick="window.print()">Imprimir / salvar PDF</button></div><div class="grid g2">${L0.map(t=>`<article class="card" role="button" tabindex="0" onclick="openTask(${t.id})" onkeydown="if(event.key==='Enter')openTask(${t.id})"><h3>${esc(t.title)}<span class="cn">${C[t.status]?.[0]||'—'}</span></h3><p class="sub">${esc(t.assignee||'Sem responsável')}${t.due?' · prazo '+esc(t.due):''}</p><div class="row">${tagOf(SEV,t.severity||'normal')} ${tagOf(PRI,t.priority||'media')} ${tagOf(APV,t.approval||'pendente')}</div>${t.checklist_total?`<div class="meter"><b style="width:${Math.round(t.checklist_done/t.checklist_total*100)}%"></b></div><small>${t.checklist_done}/${t.checklist_total} etapas</small>`:''}${ROLE==='manager'&&t.approval==='pendente'?`<div class="row"><button class="btn" onclick="event.stopPropagation();run(()=>decideTask(${t.id},'aprovado'),this)">Aprovar</button><button class="chip" onclick="event.stopPropagation();run(()=>decideTask(${t.id},'recusado'),this)">Recusar</button></div>`:''}</article>`).join('')||'<div class="card"><p class="sub">Nenhuma tarefa encontrada.</p></div>'}</div>`;
 const kan=`<div class="kan">${C.map((column,index)=>{const list=L0.filter(t=>t.status===index);return `<div class="card kan-column" data-status="${index}" ondragover="dragOverColumn(event)" ondragleave="leaveColumn(event)" ondrop="dropTask(event,${index})"><h3><i class="dot" style="background:${column[1]}"></i>${column[0]}<span class="cn">${list.length}</span></h3>${list.length?list.map(t=>`<div class="task ${index===2?'done':''}" style="--tc:${column[1]}" data-k="t${t.id}" tabindex="0" role="button" draggable="true" onclick="openTask(${t.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openTask(${t.id})}" ondragstart="startTaskDrag(event,${t.id})" ondragend="this.classList.remove('dragging');document.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'))"><div><b>${esc(t.title)}</b><small>${esc(t.assignee||'Sem responsável')}${t.due?' · prazo '+esc(t.due):''}</small><small>${tagOf(SEV,t.severity||'normal')} ${tagOf(PRI,t.priority||'media')} ${tagOf(APV,t.approval||'pendente')}</small>${t.tags?.length?`<small class="task-tags">${t.tags.map(tag=>`<span class="tag">${esc(tag)}</span>`).join(' ')}</small>`:''}${t.checklist_total?`<small>${t.checklist_done}/${t.checklist_total} etapas · ${Math.round(t.checklist_done/t.checklist_total*100)}%</small>`:''}</div><button class="x" onclick="event.stopPropagation();run(()=>delT(${t.id}),this)" onkeydown="event.stopPropagation()" title="Excluir tarefa" aria-label="Excluir tarefa">×</button></div>`).join(''):`<div class="none">${column[2]}</div>`}</div>`}).join('')}</div>`;
 const tab=`<div class="card tw"><table><tr><th>Item</th><th>Etapa</th><th>Prioridade</th><th>Prazo final</th><th>Progresso</th><th>Aprovação</th><th>Responsável</th><th></th></tr>${L0.length?L0.map(t=>`<tr data-k="t${t.id}"><td><button class="chip" onclick="openTask(${t.id})">${esc(t.title)}</button></td><td><select aria-label="Etapa" onchange="run(()=>mv(${t.id},+this.value))">${C.map((column,index)=>`<option value="${index}" ${t.status===index?'selected':''}>${column[0]}</option>`).join('')}</select></td><td><select aria-label="Prioridade" onchange="run(()=>edT(${t.id},{priority:this.value}))">${Object.keys(PRI).map(k=>`<option value="${k}" ${t.priority===k?'selected':''}>${PRI[k][0]}</option>`).join('')}</select></td><td>${esc(t.due||'—')}</td><td><input type="number" min="0" max="100" value="${t.progress||0}" aria-label="Progresso" onchange="run(()=>edT(${t.id},{progress:+this.value||0}))"></td><td><select aria-label="Aprovação" onchange="run(()=>edT(${t.id},{approval:this.value}))">${Object.keys(APV).map(k=>`<option value="${k}" ${t.approval===k?'selected':''}>${APV[k][0]}</option>`).join('')}</select></td><td>${av(t.assignee)}</td><td><button class="chip" onclick="run(()=>delT(${t.id}),this)" aria-label="Excluir">×</button></td></tr>`).join(''):`<tr><td colspan="8"><p class="sub">Nenhum item corresponde aos filtros.</p></td></tr>`}</table></div>`;
 const automationPanel=`<section class="card" style="margin-top:12px"><h3>Automações</h3><p class="sub">Regras simples e seguras, executadas quando o cartão muda.</p>${rules.map(rule=>`<div class="row"><span>${esc(rule.name)} · ${rule.trigger==='progress_complete_pending'?'100% → aprovação pendente':'custo real acima do teto → notificar'}</span><button class="chip" onclick="run(()=>toggleRule(${rule.id},${rule.active?0:1}))">${rule.active?'Ativa · pausar':'Pausada · ativar'}</button><button class="chip" onclick="run(()=>deleteRule(${rule.id}))">Excluir</button></div>`).join('')||'<p class="sub">Nenhuma regra cadastrada.</p>'}<div class="row"><input id="ruleName" placeholder="Nome da regra"><select id="ruleTrigger"><option value="progress_complete_pending">Ao chegar a 100%, solicitar aprovação</option><option value="cost_over_ceiling_notify">Ao ultrapassar o teto, notificar</option></select><button class="chip" onclick="run(addRule)">Adicionar regra</button></div></section>`;
 return `<h1>Quadros</h1><p class="sub">Arraste cards entre etapas. Abra um card para editar checklist, tags, anexos, custos e histórico.</p><div class="seg" id="bv"><i class="pill"></i><button class="${S.board!=='tab'?'on':''}" onclick="S.board='kan';refresh()">Kanban</button><button class="${S.board==='tab'?'on':''}" onclick="S.board='tab';refresh()">Tabela</button></div>
<div class="board-tools noprint"><input id="qs" placeholder="Buscar item ou responsável" value="${esc(S.q)}" onkeydown="if(event.key==='Enter'){S.q=this.value;refresh()}"><select aria-label="Severidade" onchange="S.filt=this.value;refresh()"><option value="">Qualquer severidade</option>${Object.keys(SEV).map(k=>`<option value="${k}" ${S.filt===k?'selected':''}>${SEV[k][0]}</option>`).join('')}</select><select aria-label="Etapa" onchange="S.filterStatus=this.value;refresh()"><option value="">Qualquer etapa</option>${C.map((c,i)=>`<option value="${i}" ${S.filterStatus===String(i)?'selected':''}>${c[0]}</option>`).join('')}</select><select aria-label="Prioridade" onchange="S.filterPriority=this.value;refresh()"><option value="">Qualquer prioridade</option>${Object.keys(PRI).map(k=>`<option value="${k}" ${S.filterPriority===k?'selected':''}>${PRI[k][0]}</option>`).join('')}</select><select aria-label="Aprovação" onchange="S.filterApproval=this.value;refresh()"><option value="">Qualquer aprovação</option>${Object.keys(APV).map(k=>`<option value="${k}" ${S.filterApproval===k?'selected':''}>${APV[k][0]}</option>`).join('')}</select>${departments.length?`<select aria-label="Departamento" onchange="S.filterDepartment=this.value;refresh()"><option value="">Todos os departamentos</option>${departments.map(d=>`<option value="${d.id}" ${S.filterDepartment===String(d.id)?'selected':''}>${esc(d.name)}</option>`).join('')}</select>`:''}<button class="chip" onclick="S.q=$('#qs').value;refresh()">Buscar</button><select aria-label="Filtros salvos" onchange="applyBoardFilter(this.value)"><option value="">Filtros salvos</option>${saved.map((item,index)=>`<option value="${index}">${esc(item.name)}</option>`).join('')}</select><input id="filterName" placeholder="Nome do filtro"><button class="chip" onclick="saveBoardFilter()">Salvar filtro</button><button class="chip" onclick="run(downloadBoardCsv)">Exportar CSV / Excel</button><button class="chip" onclick="window.print()">Imprimir / salvar PDF</button></div>
${S.board==='tab'?tab:kan}
<div class="card noprint" style="margin-top:12px"><h3>Novo item</h3><div class="row"><input id="nt" placeholder="Título da tarefa (N para criar)" onkeydown="if(event.key==='Enter')run(addT,$('#nt').closest('.card').querySelector('.btn'))"><input id="nw" placeholder="Responsável"><input id="nd" type="date" aria-label="Prazo">${departments.length?`<select id="ndep" aria-label="Departamento"><option value="">Sem departamento (compartilhada)</option>${departments.map(department=>`<option value="${department.id}">${esc(department.name)}</option>`).join('')}</select>`:''}</div><div class="row"><select id="nv" aria-label="Severidade">${Object.keys(SEV).map(k=>`<option value="${k}">${SEV[k][0]}</option>`).join('')}</select><select id="np" aria-label="Prioridade">${Object.keys(PRI).map(k=>`<option value="${k}" ${k==='media'?'selected':''}>${PRI[k][0]}</option>`).join('')}</select><select id="na" aria-label="Aprovação">${Object.keys(APV).map(k=>`<option value="${k}">${APV[k][0]}</option>`).join('')}</select><input id="ng" type="number" min="0" max="100" placeholder="Progresso %"><input id="nhours" type="number" min="0" step=".25" placeholder="Horas de mão de obra orçadas"><input id="nceiling" type="number" min="0" step=".01" placeholder="Teto de custo (R$)"></div><div class="row"><button class="btn" onclick="run(addT,this)">Adicionar item</button></div></div>${automationPanel}`;
}
async function mv(id,status){await api(`/tasks/${id}/status/${status}`,'PATCH');await refresh()}
async function decideTask(id,decision){await api(`/tasks/${id}/approval`,'POST',{decision});toast(`Tarefa ${decision}.`,'ok');await refresh();if(!$('#taskOverlay')?.hidden)openTask(id)}
async function delT(id){await api('/tasks/'+id,'DELETE');await gone($(`[data-k="t${id}"]`));await refresh()}
async function edT(id,p){await api('/tasks/'+id,'PATCH',p);await refresh()}
async function addT(){const t=$('#nt')?.value.trim();if(!t)return toast('Digite o título da tarefa.','no');await api('/tasks','POST',{title:t,assignee:$('#nw').value,due:$('#nd').value,severity:$('#nv').value,priority:$('#np').value,approval:$('#na').value,progress:+$('#ng').value||0,labor_budget_hours:+$('#nhours').value||0,cost_ceiling:+$('#nceiling').value||0,department_id:+$('#ndep')?.value||null});await refresh()}
async function toggleRule(id,active){await api(`/automations/${id}?active=${!!active}`,'PATCH');await refresh()}
async function deleteRule(id){await api(`/automations/${id}`,'DELETE');await refresh()}
async function addRule(){const name=$('#ruleName').value.trim();if(!name)return toast('Informe o nome da regra.','no');await api('/automations','POST',{name,trigger:$('#ruleTrigger').value});await refresh()}

function closeTask(){const overlay=$('#taskOverlay');if(overlay)overlay.hidden=true}
async function openTask(id){
 const overlay=$('#taskOverlay'),content=$('#taskDialogContent');if(!overlay||!content)return;
 try{
  const task=await api(`/tasks/${id}`),editable=ROLE==='admin',items=task.checklist||[],done=items.filter(item=>item.done).length,materials=editable?await api('/materials'):[],cost=task.cost||{};
  content.innerHTML=`<div class="task-modal-head"><div><p class="sub" style="margin:0">Tarefa #${task.id}</p><h2 id="taskModalTitle">${esc(task.title)}</h2></div><button class="chip" onclick="closeTask()">Fechar</button></div>
  <div class="row"><span class="tag">${['A fazer','Em andamento','Concluído'][task.status]||'—'}</span>${tagOf(PRI,task.priority||'media')}${tagOf(SEV,task.severity||'normal')}${tagOf(APV,task.approval||'pendente')}<span class="sub">${esc(task.assignee||'Sem responsável')} ${task.due?'· prazo '+esc(task.due):''}</span></div>
  ${editable?`<div class="row"><select id="taskStatus" aria-label="Etapa">${['A fazer','Em andamento','Concluído'].map((label,index)=>`<option value="${index}" ${task.status===index?'selected':''}>${label}</option>`).join('')}</select><input id="taskTitle" value="${esc(task.title)}" aria-label="Título"><input id="taskAssignee" value="${esc(task.assignee||'')}" placeholder="Responsável"><input id="taskProgress" type="number" min="0" max="100" value="${task.progress}" aria-label="Progresso (%)"><input id="taskDue" type="date" value="${esc(task.due||'')}" aria-label="Prazo"><button class="chip" onclick="run(()=>saveTaskDetails(${task.id}))">Salvar dados</button></div>`:''}
  <section class="card"><h3>Checklist <span class="cn">${done}/${items.length}</span></h3><div class="meter"><b style="width:${items.length?Math.round(done/items.length*100):0}%"></b></div><div class="task-checklist">${items.map(item=>`<label class="task-checkline"><input type="checkbox" ${item.done?'checked':''} ${editable?'':'disabled'} onchange="run(()=>checklistToggle(${task.id},${item.id},this.checked))"><span>${esc(item.title)}</span>${editable?`<button class="x" onclick="event.preventDefault();run(()=>removeChecklist(${task.id},${item.id}))" aria-label="Remover etapa">×</button>`:''}</label>`).join('')||'<p class="sub">Nenhuma etapa de checklist.</p>'}</div>${editable?'<div class="row"><input id="checklistTitle" placeholder="Nova etapa da checklist"><button class="chip" onclick="run(()=>addChecklist('+task.id+'))">Adicionar etapa</button></div>':''}</section>
  <section class="card"><h3>Tags</h3><div class="task-tags">${task.tags.map(tag=>`<span class="tag">${esc(tag)}</span>`).join('')||'<span class="sub">Sem tags.</span>'}</div>${editable?`<div class="row"><input id="taskTagsInput" value="${esc(task.tags.join(', '))}" placeholder="Ex.: urgente, protótipo"><button class="chip" onclick="run(()=>saveTaskTags(${task.id}))">Salvar tags</button></div>`:''}</section>
  <section class="card"><h3>Custos da tarefa</h3><div class="grid g2"><div><b>${cost.labor_hours||0} h</b><small class="sub">real · orçamento ${task.labor_budget_hours||0} h</small></div><div><b>${R(cost.labor_cost||0)}</b><small class="sub">mão de obra estimada a partir do salário mensal / 220 h</small></div><div><b>${R(cost.material_cost||0)}</b><small class="sub">insumos consumidos</small></div><div><b>${R(cost.actual_cost||0)}</b><small class="sub">custo real${task.cost_ceiling?` · teto ${R(task.cost_ceiling)}`:''}</small></div></div>${task.materials.length?`<div class="task-checklist">${task.materials.map(item=>`<div class="row">${esc(item.name)} · ${item.consumed_quantity}/${item.quantity} ${esc(item.unit)} · ${R(item.consumed_quantity*item.unit_cost)}${editable&&item.consumed_quantity===0?`<button class="x" onclick="run(()=>removeTaskMaterial(${task.id},${item.id}))" aria-label="Remover insumo">×</button>`:''}</div>`).join('')}</div>`:''}${editable?`<div class="row"><select id="taskMaterial">${materials.map(material=>`<option value="${material.id}">${esc(material.name)} · saldo ${material.stock} ${esc(material.unit)}</option>`).join('')}</select><input id="taskMaterialQty" type="number" min=".001" step=".001" placeholder="Quantidade"><button class="chip" onclick="run(()=>addTaskMaterial(${task.id}))">Vincular insumo</button></div><p class="sub">Os insumos vinculados são baixados do estoque uma vez, ao iniciar a tarefa.</p>`:''}</section>
  ${editable?`<section class="card"><h3>Anexos</h3><div class="task-checklist">${task.attachments.map(file=>`<div class="row"><button class="chip" onclick="run(()=>downloadTaskFile(${task.id},${file.id}))">${esc(file.name)} · ${(file.size/1024).toFixed(0)} KB</button><button class="x" onclick="run(()=>removeTaskFile(${task.id},${file.id}))">×</button></div>`).join('')||'<p class="sub">Sem anexos.</p>'}</div><input type="file" accept="application/pdf,image/jpeg,image/png,image/webp" onchange="run(()=>uploadTaskFile(${task.id},this))"><small class="sub">PDF ou imagem (JPG, PNG, WebP), até 6 MB.</small></section>`:`<section class="card"><h3>Anexos</h3>${task.attachments.map(file=>`<button class="chip" onclick="run(()=>downloadTaskFile(${task.id},${file.id}))">${esc(file.name)}</button>`).join('')||'<p class="sub">Sem anexos.</p>'}</section>`}
  ${ROLE==='manager'&&task.approval==='pendente'?`<div class="row"><button class="btn" onclick="run(()=>decideTask(${task.id},'aprovado'))">Aprovar</button><button class="chip" onclick="run(()=>decideTask(${task.id},'recusado'))">Recusar</button></div>`:''}
  <section class="card"><h3>Histórico</h3><div class="task-history">${task.history.map(entry=>`<article><b>${esc(entry.actor)}</b> · ${esc(entry.action)}<div>${esc(entry.details)}</div><small>${new Date(entry.created_at).toLocaleString('pt-BR')}</small></article>`).join('')||'<p class="sub">Sem alterações registradas.</p>'}</div></section>`;
  overlay.hidden=false;
 }catch(error){toast(error.message,'no')}
}
async function saveTaskDetails(id){const current=await api(`/tasks/${id}`);if(current.status!==+$('#taskStatus').value)await api(`/tasks/${id}/status/${$('#taskStatus').value}`,'PATCH');await api(`/tasks/${id}`,'PATCH',{title:$('#taskTitle').value.trim(),assignee:$('#taskAssignee').value.trim(),progress:+$('#taskProgress').value||0,due:$('#taskDue').value});await refresh();await openTask(id)}
async function addChecklist(id){const title=$('#checklistTitle').value.trim();if(!title)return toast('Digite a etapa.','no');await api(`/tasks/${id}/checklist`,'POST',{title});await openTask(id);await refresh()}
async function checklistToggle(id,item,done){await api(`/tasks/${id}/checklist/${item}`,'PATCH',{done});await openTask(id);await refresh()}
async function removeChecklist(id,item){await api(`/tasks/${id}/checklist/${item}`,'DELETE');await openTask(id);await refresh()}
async function saveTaskTags(id){const tags=$('#taskTagsInput').value.split(',').map(tag=>tag.trim()).filter(Boolean);await api(`/tasks/${id}/tags`,'PUT',{tags});await openTask(id);await refresh()}
async function uploadTaskFile(id,input){const file=input.files?.[0];if(!file)return;if(file.size>6*1024*1024)throw new Error('O anexo deve ter até 6 MB.');const content=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(file)});await api(`/tasks/${id}/attachments`,'POST',{name:file.name,mime:file.type,content_base64:content});await openTask(id);await refresh()}
async function downloadTaskFile(taskId,fileId){const response=await fetch(`/tasks/${taskId}/attachments/${fileId}`,{headers:{Authorization:'Bearer '+TOKEN}});if(!response.ok)throw new Error('Não foi possível baixar o anexo.');const url=URL.createObjectURL(await response.blob()),link=document.createElement('a');link.href=url;link.download='anexo';link.click();URL.revokeObjectURL(url)}
async function removeTaskFile(taskId,fileId){await api(`/tasks/${taskId}/attachments/${fileId}`,'DELETE');await openTask(taskId);await refresh()}
async function addTaskMaterial(taskId){const material_id=+$('#taskMaterial').value,quantity=+$('#taskMaterialQty').value;if(!material_id||quantity<=0)return toast('Escolha o material e informe uma quantidade válida.','no');await api(`/tasks/${taskId}/materials`,'POST',{material_id,quantity});await openTask(taskId);await refresh()}
async function removeTaskMaterial(taskId,linkId){await api(`/tasks/${taskId}/materials/${linkId}`,'DELETE');await openTask(taskId);await refresh()}

TAB.custeio=custeio;
