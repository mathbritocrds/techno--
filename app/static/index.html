<script>const systemTheme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';const root=document.documentElement;try{root.dataset.theme=localStorage.getItem('theme')||systemTheme;const motion=localStorage.getItem('motion');root.dataset.motion=motion==='full'||motion==='reduced'?motion:'system'}catch(e){root.dataset.theme=systemTheme;root.dataset.motion='system'}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Fraunces:wght@500;600&display=swap">
<style>
:root{--bg:#F3F8F5;--ink:#35453E;--mute:#74827B;--card:rgba(255,255,255,.94);--line:rgba(80,126,103,.13);--y:#5E9D7C;--o:#D6A458;--g:#5B9B77;--r:#CF7771;--b:#7799B8;--btn-ink:#FFFFFF;--inp:#FFFFFF;--hair:rgba(80,126,103,.18);--shine:#F9FCFA;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);color-scheme:light}

*{box-sizing:border-box}
:root[data-theme=dark] body{background:linear-gradient(135deg,#171D19 0%,#202521 52%,#24211F 100%)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}

button:focus-visible,input:focus-visible,select:focus-visible,.task:focus-visible{outline:2px solid var(--b);outline-offset:2px}

/* ---------- Fundo atmosférico em camadas, animado apenas por transform ---------- */
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;will-change:transform}
.orbs i:nth-child(1){width:420px;height:420px;left:calc(62% - 210px);top:calc(20% - 210px);background:radial-gradient(closest-side,rgba(120,182,148,.22),transparent);animation:d1 38s ease-in-out infinite alternate}
.orbs i:nth-child(2){width:520px;height:520px;left:-300px;top:calc(72% - 260px);background:radial-gradient(closest-side,rgba(145,175,199,.2),transparent);animation:d2 46s ease-in-out infinite alternate}
.orbs i:nth-child(3){width:360px;height:360px;right:-180px;top:calc(76% - 180px);background:radial-gradient(closest-side,rgba(232,162,142,.17),transparent);animation:d3 42s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate3d(-42px,34px,0) scale(1.06)}}
@keyframes d2{to{transform:translate3d(38px,-28px,0) scale(1.04)}}

#root{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:14px}

@keyframes out{to{opacity:0;transform:translateY(-12px) scale(.98)}}
.view{animation:viewIn .8s var(--ease) backwards}
@keyframes viewIn{from{opacity:0;transform:translateY(26px) scale(.97)}}

/* ---------- Navegação ---------- */
nav{display:flex;align-items:center;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;flex-wrap:nowrap}
nav::-webkit-scrollbar{display:none}

@keyframes navIn{from{opacity:0;transform:translateY(-16px)}}
.logo{font:600 22px Fraunces,Georgia,serif;margin-right:4px;display:flex;align-items:center;gap:8px;flex:none}
.mk{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,#78B694,#E8A28E);display:inline-block}
.login .mk{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.45);box-shadow:0 0 0 7px rgba(120,182,148,.2)}}
.tabs,.seg{position:relative;display:flex;flex-wrap:nowrap;gap:2px;padding:4px;border-radius:99px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);flex:none}
.pill{position:absolute;top:4px;left:0;height:calc(100% - 8px);width:0;border-radius:99px;background:#DCEDE3;box-shadow:0 3px 10px rgba(80,126,103,.12);transition:transform .55s var(--ease),width .55s var(--ease),background-color .5s;pointer-events:none}
.tabs button,.seg button{position:relative;z-index:1;border:0;background:none;color:var(--ink);padding:8px 14px;border-radius:99px;font:500 13px Outfit,sans-serif;cursor:pointer;white-space:nowrap;transition:color .35s var(--ease)}
.tabs button.on,.seg button.on{color:#456B55}
.seg{margin:12px 0 4px}.seg button{flex:1}
button.chip{border:1px solid var(--line);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);padding:8px 14px;border-radius:99px;font:500 13px Outfit,sans-serif;cursor:pointer;white-space:nowrap;transition:transform .25s var(--ease),box-shadow .25s}
button.chip:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(30,40,60,.1)}
button.chip:active{transform:scale(.95)}
.btn:active,.tabs button:active,.seg button:active{transform:scale(.96)}
.btn:focus-visible,button.chip:focus-visible{outline:2px solid var(--b);outline-offset:3px}
button.chip.ico{padding:8px 10px;display:grid;place-items:center}
.tg{transition:transform .7s var(--spring)}
.sp{flex:1}

/* ---------- Tipografia e cartões ---------- */
h1{font:500 30px Fraunces,Georgia,serif;margin:22px 0 2px;letter-spacing:-.4px}
.lh1{font-size:26px;margin:14px 0 4px}
.sub{color:var(--mute);margin:0 0 16px;max-width:64ch;line-height:1.5}
.grid{display:grid;gap:12px}.k4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 8px 28px rgba(30,40,60,.08)}
.card h3{margin:0 0 10px;font-size:13px;font-weight:500;color:var(--mute);display:flex;align-items:center;gap:7px}
.big{font-size:30px;font-variant-numeric:tabular-nums}.d{font-size:12px;margin-left:6px;color:var(--mute)}.cap{font-size:11px;color:var(--mute);margin-top:6px}
.cnt{font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.cn{margin-left:auto;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--hair);color:var(--ink)}
.spark{display:flex;align-items:flex-end;gap:3px;height:42px;margin-top:10px}
.spark i{flex:1;background:linear-gradient(var(--o),var(--y));border-radius:2px;min-height:3px}
.bar{height:8px;border-radius:9px;background:var(--hair);overflow:hidden;margin:8px 0}.bar b{display:block;height:100%;background:var(--g);border-radius:9px}
.stack{display:flex;height:22px;border-radius:7px;overflow:hidden;margin:10px 0 8px;gap:2px}.stack i{display:block;min-width:2px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mute);font-size:12px}.leg b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.cost-chart{display:grid;gap:14px;margin-top:12px}.cost-row{display:grid;grid-template-columns:minmax(90px,150px) minmax(120px,1fr) minmax(95px,auto);align-items:center;gap:12px;animation:chartRowIn .55s var(--ease) both;animation-delay:calc(var(--chart-index,0)*90ms)}.cost-name{overflow-wrap:anywhere}.cost-track{height:18px;display:flex;background:var(--hair);border-radius:4px;overflow:hidden}.cost-track i{height:100%;min-width:0;transform-origin:left center;animation:chartGrow .85s var(--ease) both;animation-delay:calc(var(--chart-index,0)*90ms + 130ms)}.cost-track .paid{background:#70B88B}.cost-track .open{background:#E9C270}.cost-track .payroll{background:#91AFC7}.cost-value{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.ai-summary{white-space:pre-line;line-height:1.65;margin:0;color:var(--ink)}
@keyframes chartRowIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes chartGrow{from{transform:scaleX(.03);opacity:.45}to{transform:scaleX(1);opacity:1}}
.gauge{display:block;margin:0 auto;max-width:210px;width:100%}
table{width:100%;border-collapse:collapse}th{text-align:left;font-weight:500;color:var(--mute);font-size:12px;padding:6px 8px}td{padding:9px 8px;border-top:1px solid var(--hair);transition:background-color .25s}.tw{overflow-x:auto}
tr:hover>td{background:rgba(120,182,148,.1)}
.tag{padding:2px 9px;border-radius:99px;font-size:11px;background:rgba(91,155,119,.16);color:#477D5D;transition:background-color .4s,color .4s}.tag.w{background:rgba(233,194,112,.24);color:#8A6A2D}.tag.x{background:rgba(207,119,113,.16);color:#A85450}
.btn{position:relative;background:var(--y);border:0;color:var(--btn-ink);padding:9px 16px;border-radius:99px;font:600 13px Outfit,sans-serif;cursor:pointer;transition:transform .25s var(--ease),box-shadow .3s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(94,157,124,.25)}
.btn:active{transform:scale(.97)}
.btn.l{width:100%;padding:15px;font-size:16px;margin-top:12px}
.busy{pointer-events:none;color:transparent!important}
.busy:after{content:"";position:absolute;inset:0;margin:auto;width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.28);border-top-color:#fff;animation:spin .7s linear infinite}
.chip.busy:after{border-color:var(--hair);border-top-color:var(--ink)}
@keyframes spin{to{transform:rotate(360deg)}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
input,select{font:inherit;color:var(--ink);background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:70px;transition:border-color .25s,box-shadow .25s,background-color .5s}
textarea{font:inherit;color:var(--ink);background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:92px;resize:vertical}
input:focus,select:focus{outline:0;border-color:var(--y);box-shadow:0 0 0 4px rgba(94,157,124,.18)}
textarea:focus{outline:0;border-color:var(--y);box-shadow:0 0 0 4px rgba(94,157,124,.18)}
input[type=checkbox]{accent-color:var(--y)}
label{display:block;color:var(--mute);font-size:12px;margin:10px 0 4px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.row>*{flex:1}.row>.btn{flex:none}
.empty p{margin:0 0 4px;color:var(--mute)}
.message-list{display:grid;gap:9px;max-height:52vh;overflow:auto;padding:2px 4px 2px 0}
.message-item{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--inp);overflow-wrap:anywhere}
.message-meta{display:flex;justify-content:space-between;gap:10px;color:var(--mute);font-size:11px;margin-bottom:5px}
.message-item p{margin:0;white-space:pre-wrap;line-height:1.5}

/* ---------- Primeiros passos ---------- */
.steps{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.steps li{display:flex;align-items:center;gap:10px;color:var(--mute)}
.steps li.done{color:var(--ink)}
.steps button{all:unset;display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:8px}
.steps button:hover .st{color:var(--ink);transform:translateX(3px)}.st{transition:transform .3s var(--ease),color .3s}
.steps button:focus-visible{outline:2px solid var(--b);outline-offset:3px}
.ck{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--hair);display:grid;place-items:center;transition:background-color .3s,border-color .3s}
.done .ck{background:var(--g);border-color:var(--g)}
.ck svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:16;stroke-dashoffset:16}
.done .ck svg{stroke-dashoffset:0}

/* ---------- Quadros ---------- */
.kan{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;align-items:start}
.task{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--tc,var(--hair));border-radius:12px;padding:11px;margin-top:8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;transition:transform .3s var(--ease),box-shadow .3s}
.task:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(30,40,60,.12)}
.task:active{transform:scale(.98)}
.task small{color:var(--mute);display:block;margin-top:4px}
.task.done b{opacity:.55;text-decoration:line-through;text-decoration-thickness:1px}
.x{all:unset;cursor:pointer;color:var(--mute);padding:0 6px;font-size:16px;line-height:1;transition:color .2s,transform .3s var(--spring)}.x:hover{color:var(--r);transform:scale(1.3)}.x:focus-visible{outline:2px solid var(--b)}
.none{border:1.5px dashed var(--hair);border-radius:12px;padding:16px;text-align:center;color:var(--mute);margin-top:8px}

/* ---------- Mensagens, ponto ao vivo e comprovante ---------- */
.login{min-height:90vh;display:grid;place-items:center}.lc{width:100%;max-width:380px}.login-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.theme-toggle{width:40px;height:40px;padding:0;font-size:18px}
.boot-screen{min-height:90vh;display:grid;place-items:center}.boot-content{display:grid;justify-items:center;gap:16px;text-align:center}.boot-content .logo{font-size:28px}.boot-spinner{width:28px;height:28px;border:2px solid var(--hair);border-top-color:var(--y);border-radius:50%;animation:spin .8s linear infinite}.boot-label{margin:0;color:var(--mute);font-size:13px}.account-link{margin-top:14px;width:100%;min-height:44px}
.lc.signup-card{max-width:540px}
.login-tools{display:flex;align-items:center;gap:8px}.motion-control{display:flex;align-items:center;gap:7px;min-height:40px;padding:8px 10px;margin:0;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--mute);font-size:12px;white-space:nowrap;cursor:pointer}.motion-control input{width:16px;min-width:16px;height:16px;margin:0;accent-color:var(--y)}
.msg{padding:12px;border-radius:12px;margin-top:12px;font-weight:500;transition:background-color .4s,color .4s}
.msg.in,.fi{animation:fi .55s var(--ease) backwards}
@keyframes fi{from{opacity:0;transform:translateY(10px)}}
.fo{opacity:0;transform:translateY(6px);transition:opacity .15s,transform .15s}
.ok{background:rgba(40,167,69,.18);color:var(--g)}.no{background:rgba(220,53,69,.15);color:var(--r)}
.dotp{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:8px;position:relative}
.dotp:after{content:"";position:absolute;inset:0;border-radius:50%;background:currentColor;animation:ping 1.7s ease-out infinite}
.msg.no .dotp:after{display:none}
@keyframes ping{to{transform:scale(3);opacity:0}}
.meter{height:6px;border-radius:9px;background:rgba(120,130,150,.25);overflow:hidden;margin-top:9px}
.meter b{display:block;height:100%;width:0;border-radius:9px;background:currentColor;transition:width .9s var(--ease)}
.okc{display:block;width:68px;height:68px;margin:14px auto 2px;animation:okpop .6s var(--spring) backwards}
@keyframes okpop{from{transform:scale(.5);opacity:0}}
.okc circle{fill:rgba(40,167,69,.14);stroke:var(--g);stroke-width:2.5;stroke-dasharray:146;stroke-dashoffset:146;animation:dr .7s var(--ease) forwards}
.okc path{fill:none;stroke:var(--g);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:dr .45s var(--ease) .5s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.ticket{animation:rise .8s var(--ease) .3s backwards}
.ticket .ln{animation:rise .6s var(--ease) backwards;animation-delay:calc(.55s + var(--i,0)*90ms);line-height:1.7}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,26px) scale(.95);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;z-index:9;max-width:90vw;display:flex;align-items:center;gap:10px;box-shadow:0 12px 32px rgba(0,0,0,.25);transition:opacity .35s,transform .55s var(--spring)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.td{width:9px;height:9px;border-radius:50%;background:var(--y);flex:none}.td.ok{background:var(--g)}.td.no{background:var(--r)}

/* ---------- Entrada das telas ---------- */
main.leave{animation:leave .21s ease-in forwards}
@keyframes leave{to{opacity:0;transform:translate3d(calc(var(--dir,0)*-30px),-6px,0)}}
.rise{animation:rise .75s var(--ease) backwards;animation-delay:calc(var(--i,0)*70ms + 40ms)}
@keyframes rise{from{opacity:0;transform:translate3d(calc(var(--dir,0)*36px),20px,0) scale(.985)}}
.animate .spark i{transform-origin:bottom;animation:grow .8s var(--ease) backwards;animation-delay:calc(var(--k,0)*35ms + 320ms)}
@keyframes grow{from{transform:scaleY(0)}}
.animate .bar b{transform-origin:left;animation:sx 1.1s var(--ease) .4s backwards}
@keyframes sx{from{transform:scaleX(0)}}
.animate .stack{animation:reveal 1.1s var(--ease) .4s backwards}
@keyframes reveal{from{clip-path:inset(0 100% 0 0 round 7px)}to{clip-path:inset(0 0 0 0 round 7px)}}
.animate .gfill{animation:gdraw 1.4s var(--ease) .3s backwards}
@keyframes gdraw{from{stroke-dasharray:0 100}}
.animate .done .ck{animation:pop .5s var(--spring) backwards;animation-delay:calc(.5s + var(--k,0)*.12s)}
.animate .done .ck svg{animation:dr2 .5s var(--ease) backwards;animation-delay:calc(.6s + var(--k,0)*.12s)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes dr2{from{stroke-dashoffset:16}}
.animate tr{animation:rowIn .6s var(--ease) backwards;animation-delay:calc(var(--r,0)*40ms + 350ms)}
@keyframes rowIn{from{opacity:0;transform:translateX(-10px)}}
.flash{animation:flash 1.3s ease-out}
@keyframes flash{from{background-color:rgba(120,182,148,.25)}}
.sk{height:110px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(100deg,var(--card) 30%,var(--shine) 50%,var(--card) 70%) 0 0/220% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-220% 0}}

@media (prefers-reduced-motion:reduce){:root:not([data-motion=full]) *, :root:not([data-motion=full]) *::before, :root:not([data-motion=full]) *::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}:root:not([data-motion=full]) .orbs i{will-change:auto}}
:root[data-motion=reduced] *, :root[data-motion=reduced] *::before, :root[data-motion=reduced] *::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
@media print{.orbs,nav,#toast,.noprint,.seg{display:none!important}body{background:#fff;color:#000}.card{background:#fff;box-shadow:none;border:1px solid #ccc;backdrop-filter:none}}
</style></head><body>
<div class="orbs" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="root"><div class="boot-screen" role="status" aria-label="Carregando SIGI"><div class="boot-content"><div class="logo"><i class="mk"></i>SIGI</div><span class="boot-spinner" aria-hidden="true"></span><p class="boot-label">Preparando seu espaço de trabalho…</p></div></div></div><div id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),R=v=>'R$ '+(+v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wait=ms=>new Promise(r=>setTimeout(r,ms)),still=()=>{const mode=document.documentElement.dataset.motion;return mode==='reduced'||(mode!=='full'&&matchMedia('(prefers-reduced-motion: reduce)').matches)};

 if(ROLE==='admin'){
  employees=(await api('/employees')).filter(e=>e.active);
  if(S.messageTarget!=='team'&&!employees.some(e=>String(e.id)===String(S.messageTarget)))S.messageTarget='team';
 }
 const options=ROLE==='admin'?`<option value="team" ${S.messageTarget==='team'?'selected':''}>Equipe toda</option>${employees.map(e=>`<option value="${e.id}" ${String(S.messageTarget)===String(e.id)?'selected':''}>Privado · ${esc(e.name)}</option>`).join('')}`:`<option value="team" ${S.messageTarget==='team'?'selected':''}>Equipe toda</option><option value="private" ${S.messageTarget==='private'?'selected':''}>Conversa privada com a chefia</option>`;
 return `<h1>Comunicação</h1><p class="sub">${ROLE==='admin'?'Comunicados para toda a equipe e conversas privadas com cada funcionário.':'Converse com a equipe ou envie uma mensagem privada à chefia.'}</p>
 <div class="card"><div class="row" style="align-items:center;margin:0"><h3 style="flex:1;margin:0">${ROLE==='admin'?'Destino':'Conversar com'}</h3><select id="msg-target" aria-label="Destino da conversa" onchange="S.messageTarget=this.value;run(loadMessages)">${options}</select><button class="chip" onclick="run(loadMessages,this)" title="Atualizar mensagens">Atualizar</button></div>
 <div id="message-list" class="message-list" style="margin:14px 0" aria-live="polite"><p class="sub">Carregando mensagens…</p></div>
 <label for="message-body">Nova mensagem</label><textarea id="message-body" maxlength="2000" placeholder="Escreva uma mensagem para ${ROLE==='admin'?'a equipe ou o funcionário selecionado':'a equipe ou sua chefia'}"></textarea>
 <div class="row" style="justify-content:flex-end"><span class="sub" style="flex:1;margin:0;align-self:center">Mensagens de equipe são visíveis a todos. Conversas privadas são acessíveis somente à chefia e ao funcionário.</span><button class="btn" onclick="run(sendMessage,this)">Enviar mensagem</button></div></div>`
}
async function loadMessages(){
 const list=$('#message-list');if(!list)return;
 const target=$('#msg-target')?.value||S.messageTarget;
 const query=ROLE==='admin'&&target!=='team'?`?employee_id=${encodeURIComponent(target)}`:'';
 const messages=await api('/messages'+query);
 list.innerHTML=messages.length?messages.map(m=>`<article class="message-item"><div class="message-meta"><b>${esc(m.sender_name)}${m.sender_role==='admin'?' · Chefia':''}</b><time>${new Date(m.created_at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</time></div><p>${esc(m.body)}</p></article>`).join(''):`<p class="sub">${target==='team'?'Nenhuma mensagem da equipe ainda.':'Nenhuma mensagem nesta conversa privada.'}</p>`;
 list.scrollTop=list.scrollHeight;
}
async function sendMessage(){
 const body=$('#message-body').value,target=$('#msg-target').value,scope=target==='team'?'team':'private';
 await api('/messages','POST',{scope,employee_id:ROLE==='admin'&&scope==='private'?+target:undefined,body});
 $('#message-body').value='';await loadMessages();toast('Mensagem enviada.','ok')
}
const sparks=a=>{const m=Math.max(...a,1);return '<div class="spark">'+a.map(v=>`<i style="height:${Math.max(7,v/m*100)}%"></i>`).join('')+'</div>'};
function gauge(p){return `<svg class="gauge" viewBox="0 0 160 100"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#E9C270"/><stop offset=".55" stop-color="#70B88B"/><stop offset="1" stop-color="#91AFC7"/></linearGradient></defs>
<path d="M12 84A68 68 0 0 1 148 84" fill="none" stroke="rgba(120,130,150,.25)" stroke-width="14" stroke-linecap="round" pathLength="100"/>
<path class="gfill" d="M12 84A68 68 0 0 1 148 84" fill="none" stroke="url(#gg)" stroke-width="14" stroke-linecap="round" pathLength="100" stroke-dasharray="${Math.max(p,.5)} 100"/>
<text class="cnt" data-v="${p}" data-f="p" x="80" y="72" text-anchor="middle" font-size="24" fill="currentColor" font-family="Outfit">${Math.round(p)}%</text><text x="80" y="88" text-anchor="middle" font-size="9" fill="var(--mute)">das tarefas</text></svg>`}
const when=s=>new Date(s).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const logRows=L=>L.length?`<div class="tw"><table><tr><th>Nome</th><th>Quando</th><th>Tipo</th><th>Distância</th><th>Status</th></tr>${L.map(x=>`<tr><td>${esc(x.name)}</td><td>${when(x.at)}</td><td>${x.kind=='entrada'?'Entrada':'Saída'}</td><td>${Math.round(x.distance_m)} m</td><td><span class="tag ${x.accepted?'':'x'}" title="${esc(x.reason)}">${x.accepted?'Válido':'Recusado'}</span></td></tr>`).join('')}</table></div>`:'<p class="sub">Nenhum registro ainda. Os funcionários batem ponto na tela inicial.</p>';
const saudacao=()=>{const h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'};
const CK='<i class="ck"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg></i>';
const SEV={normal:['Ok',''],atencao:['Atenção','w'],critico:['Crítico','x']};
const PRI={baixa:['Baixa',''],media:['Média','w'],alta:['Alta','x']};
const APV={pendente:['Pendente','w'],aprovado:['Aprovado',''],recusado:['Recusado','x']};
const KND={gestao:'Gestão',producao:'Produção',pessoas:'Pessoas',financeiro:'Financeiro'};
const INT={webhook:'Webhook',csv:'CSV',whatsapp:'WhatsApp',erp:'ERP'};
function tagOf(map,k){const x=map[k]||[k,'w'];return `<span class="tag ${x[1]}">${x[0]}</span>`}
function prog(p){p=+p||0;return `<div class="bar" style="margin:0;min-width:72px"><b style="width:${p}%"></b></div>`}
function av(n){const s=esc((n||'A')[0].toUpperCase());return `<span class="tag" style="background:rgba(145,175,199,.22);color:#607E97">${s}</span> ${esc(n||'—')}`}
function dreCards(d){const neg=d.lucro<0;return `<div class="grid k4" style="margin-top:12px">
<div class="card"><h3>Receita bruta</h3><span class="big">${cnt(d.receita,'R')}</span></div>
<div class="card"><h3>Consumo matéria-prima</h3><span class="big">${cnt(d.materia,'R')}</span></div>
<div class="card"><h3>Custos operacionais + impostos</h3><span class="big">${cnt(d.custos,'R')}</span></div>
<div class="card"><h3>Lucro líquido grosso</h3><span class="big">${cnt(d.lucro,'R')}</span><span class="d"><span class="tag ${neg?'x':''}">${(d.margem_pct||0).toLocaleString('pt-BR')}%</span></span></div>
</div>`}

<div class="card"><h3>Ponto ao vivo</h3>${logRows(d.recent)}</div></div>`}

TAB.quadros=quadros;
async function quadros(){const T=await api('/tasks'),C=[['A fazer','var(--o)','Nenhuma tarefa pendente.'],['Em andamento','var(--b)','Nada em andamento agora.'],['Concluído','var(--g)','Nada concluído ainda.']];
 const q=(S.q||'').toLowerCase(),f=S.filt||'';
 const L0=T.filter(t=>(!q||t.title.toLowerCase().includes(q)||(t.assignee||'').toLowerCase().includes(q))&&(!f||t.severity==f||t.priority==f||t.approval==f));
 const kan=`<div class="kan">${C.map((c,i)=>{const L=L0.filter(t=>t.status==i);return `<div class="card"><h3><i class="dot" style="background:${c[1]}"></i>${c[0]}<span class="cn">${L.length}</span></h3>${L.length?L.map(t=>`<div class="task ${i==2?'done':''}" style="--tc:${c[1]}" data-k="t${t.id}" tabindex="0" role="button" onclick="run(()=>mv(${t.id},${(t.status+1)%3}))" onkeydown="if(event.key=='Enter'||event.key==' '){event.preventDefault();this.click()}"><div><b>${esc(t.title)}</b><small>${esc(t.assignee||'Sem responsável')}${t.due?' · prazo '+esc(t.due):''}</small><small>${tagOf(SEV,t.severity||'normal')} ${tagOf(PRI,t.priority||'media')} ${tagOf(APV,t.approval||'pendente')}</small></div><button class="x" onclick="event.stopPropagation();run(()=>delT(${t.id}))" onkeydown="event.stopPropagation()" title="Excluir tarefa" aria-label="Excluir tarefa">×</button></div>`).join(''):`<div class="none">${c[2]}</div>`}</div>`}).join('')}</div>`;
 const tab=`<div class="card tw"><table><tr><th>Item</th><th>Status</th><th>Prioridade</th><th>Prazo final</th><th>Progresso</th><th>Aprovação</th><th>Responsável</th><th></th></tr>
${L0.length?L0.map(t=>`<tr data-k="t${t.id}"><td><b>${esc(t.title)}</b></td>
<td><select aria-label="Status" onchange="run(()=>edT(${t.id},{severity:this.value}))">${Object.keys(SEV).map(k=>`<option value="${k}" ${t.severity==k?'selected':''}>${SEV[k][0]}</option>`).join('')}</select></td>
<td><select aria-label="Prioridade" onchange="run(()=>edT(${t.id},{priority:this.value}))">${Object.keys(PRI).map(k=>`<option value="${k}" ${t.priority==k?'selected':''}>${PRI[k][0]}</option>`).join('')}</select></td>
<td>${esc(t.due||'—')}</td>
<td><input type="number" min="0" max="100" value="${t.progress||0}" aria-label="Progresso" onchange="run(()=>edT(${t.id},{progress:+this.value||0}))"></td>
<td><select aria-label="Aprovação" onchange="run(()=>edT(${t.id},{approval:this.value}))">${Object.keys(APV).map(k=>`<option value="${k}" ${t.approval==k?'selected':''}>${APV[k][0]}</option>`).join('')}</select></td>
<td>${av(t.assignee)}</td>
<td><button class="chip" onclick="run(()=>delT(${t.id}),this)" aria-label="Excluir">×</button></td></tr>`).join(''):`<tr><td colspan="8"><p class="sub">Nenhum item. Adicione o primeiro abaixo.</p></td></tr>`}</table></div>`;
 return `<h1>Quadros</h1><p class="sub">Toque em uma tarefa para avançar a etapa, ou use a tabela para status, prioridade, prazo, progresso e aprovação.</p>
<div class="seg" id="bv"><i class="pill"></i><button class="${S.board!='tab'?'on':''}" onclick="S.board='kan';refresh()">Kanban</button><button class="${S.board=='tab'?'on':''}" onclick="S.board='tab';refresh()">Tabela</button></div>
<div class="row" style="margin:8px 0 12px"><input id="qs" placeholder="Buscar item ou responsável" value="${esc(S.q||'')}" onkeydown="if(event.key=='Enter'){S.q=this.value;refresh()}"><select aria-label="Filtro" onchange="S.filt=this.value;refresh()"><option value="">Filtro</option><option value="critico" ${f=='critico'?'selected':''}>Crítico</option><option value="alta" ${f=='alta'?'selected':''}>Alta prioridade</option><option value="pendente" ${f=='pendente'?'selected':''}>Aprovação pendente</option><option value="aprovado" ${f=='aprovado'?'selected':''}>Aprovado</option></select><button class="chip" onclick="S.q=$('#qs').value;refresh()">Buscar</button></div>
${S.board=='tab'?tab:kan}
<div class="card" style="margin-top:12px"><h3>Novo item</h3><div class="row"><input id="nt" placeholder="Título (ex.: LOTE 042 — AGOSTO 2026)" onkeydown="if(event.key=='Enter')run(addT,$('#nt').closest('.card').querySelector('.btn'))"><input id="nw" placeholder="Responsável"><input id="nd" placeholder="Prazo (AAAA-MM-DD)"></div>

async function mv(id,s){await api(`/tasks/${id}/status/${s}`,'PATCH');await refresh()}
async function delT(id){await api('/tasks/'+id,'DELETE');await gone($(`[data-k="t${id}"]`));await refresh()}

async function addT(){const t=$('#nt').value.trim();if(!t)return toast('Digite o título da tarefa.','no');

TAB.financeiro=financeiro;
async function financeiro(){const month=S.financeMonth||new Date().toISOString().slice(0,7);S.financeMonth=month;
 const [s,T,D,costs]=await Promise.all([api('/finance/summary'),api('/finance?status=open'),api('/departments'),api('/finance/department-costs?month='+month)]),hoje=new Date().toLocaleDateString('sv');
 const maxCost=Math.max(...costs.departments.map(d=>d.total),1),parts=[['Pago','paid'],['Em aberto','open'],['Folha','payroll']];
 const chart=costs.departments.length?`<div class="cost-chart" role="img" aria-label="Custos mensais por setor, separados entre despesas pagas, em aberto e folha">${costs.departments.map((d,i)=>`<div class="cost-row" style="--chart-index:${i}"><b class="cost-name">${esc(d.name)}</b><div class="cost-track" aria-hidden="true">${parts.map(p=>`<i class="${p[1]}" style="width:${d[p[1]]/maxCost*100}%" title="${p[0]}: ${R(d[p[1]])}"></i>`).join('')}</div><b class="cost-value">${R(d.total)}</b></div>`).join('')}</div>`:'<p class="sub">Nenhum setor ou custo para esta competência.</p>';
 return `<h1>Financeiro</h1><p class="sub">Contas a pagar e a receber. A previsão de caixa já desconta a folha do mês.</p>
<div class="grid k4"><div class="card"><h3>A receber</h3><span class="big">${cnt(s.receber_aberto,'R')}</span><span class="d">${R(s.receber_vencido)} vencido</span></div><div class="card"><h3>A pagar</h3><span class="big">${cnt(s.pagar_aberto,'R')}</span><span class="d">${R(s.pagar_vencido)} vencido</span></div><div class="card"><h3>Folha mensal</h3><span class="big">${cnt(s.folha_mensal,'R')}</span></div></div>
<div class="card" style="margin-top:12px"><div class="row" style="align-items:center;margin:0"><h3 style="margin:0;flex:1">Custeio mensal por setor</h3><input type="month" value="${month}" aria-label="Competência dos custos" onchange="S.financeMonth=this.value;refresh()"></div><div class="leg" style="margin-top:12px">${parts.map(p=>`<span><b style="background:var(--${p[1]=='paid'?'g':p[1]=='open'?'o':'b'})"></b>${p[0]}</span>`).join('')}</div>${chart}<div class="row"><span class="sub" style="margin:0;flex:1">Total no mês: <b>${R(costs.totals.total)}</b> · despesas pagas ${R(costs.totals.paid)} · em aberto ${R(costs.totals.open)} · folha ${R(costs.totals.payroll)}</span></div></div>
<div class="card tw" style="margin-top:12px"><h3>Fluxo de caixa previsto</h3><table><tr><th>Mês</th><th>A receber</th><th>A pagar</th><th>Folha</th><th>Saldo</th></tr>${s.fluxo.map(f=>`<tr><td>${f.month.split('-').reverse().join('/')}</td><td>${R(f.receber)}</td><td>${R(f.pagar)}</td><td>${R(f.folha)}</td><td><span class="tag ${f.saldo<0?'x':''}">${R(f.saldo)}</span></td></tr>`).join('')}</table></div>
<div class="card tw" style="margin-top:12px"><div class="row" style="align-items:center;margin:0"><h3 style="margin:0;flex:1">Lançamentos em aberto</h3><button class="chip" onclick="run(exportFinanceCsv,this)">Exportar CSV</button></div>${T.length?`<table><tr><th>Tipo</th><th>Descrição</th><th>Setor</th><th>Vencimento</th><th>Valor</th><th></th></tr>${T.map(t=>`<tr data-k="x${t.id}"><td><span class="tag ${t.kind=='pagar'?'w':''}">${t.kind=='pagar'?'Pagar':'Receber'}</span></td><td>${esc(t.description)}</td><td>${esc(t.department||'—')}</td><td>${dbr(t.due)}${t.due<hoje?' <span class="tag x">vencido</span>':''}</td><td>${R(t.amount)}</td><td style="white-space:nowrap"><button class="chip" onclick="run(()=>payT(${t.id}),this)">${t.kind=='pagar'?'Marcar como pago':'Marcar como recebido'}</button> <button class="chip" onclick="run(()=>delTx(${t.id}),this)" title="Excluir lançamento" aria-label="Excluir lançamento">×</button></td></tr>`).join('')}</table>`:'<p class="sub">Nenhum lançamento em aberto. Adicione o primeiro abaixo.</p>'}</div>
<div class="card" style="margin-top:12px"><h3>Novo lançamento</h3><div class="row"><select id="fk" aria-label="Tipo" onchange="$('#fdep').disabled=this.value!='pagar'"><option value="receber">A receber</option><option value="pagar">A pagar</option></select><input id="fd" placeholder="Descrição"><input id="fv" type="number" min="0" step="0.01" placeholder="Valor"><input id="ft" type="date" aria-label="Vencimento"><select id="fdep" aria-label="Setor da despesa" disabled><option value="">Sem setor</option>${D.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></div><div class="row"><button class="btn" onclick="run(addTx,this)">Adicionar lançamento</button></div></div>`}
async function exportFinanceCsv(){const response=await fetch('/finance/export.csv',{headers:{Authorization:'Bearer '+TOKEN}}),data=await response.blob();if(!response.ok)throw new Error('Não foi possível exportar o financeiro.');const link=document.createElement('a');link.href=URL.createObjectURL(data);link.download='financeiro.csv';link.click();URL.revokeObjectURL(link.href);toast('Relatório financeiro exportado.','ok')}
async function payT(id){await api(`/finance/${id}/paid`,'PATCH');await gone($(`[data-k="x${id}"]`));await refresh()}

TAB.ponto=ponto;
async function ponto(){let w=null,co={name:'',cnpj:''};try{w=await api('/settings/workplace')}catch(e){}try{co=await api('/settings/company')}catch(e){}
 const m=S.month||new Date().toISOString().slice(0,7);S.month=m;
 const [L,TS]=await Promise.all([api('/time-entries?limit=30'),api('/timesheet?month='+m)]);
 return `<h1>Ponto eletrônico</h1><p class="sub">O funcionário só registra dentro do raio da sede, com a localização lida em tempo real no aparelho. A distância é conferida no servidor.</p>
<div class="grid g2"><div class="card"><h3>Local de trabalho</h3><p>${w?`Sede em ${w.lat.toFixed(5)}, ${w.lng.toFixed(5)}`:'Ainda não definido. Vá até o local de trabalho e use o botão abaixo.'}</p><label for="rr">Raio permitido (metros)</label><input id="rr" type="number" min="10" max="5000" value="${w?w.radius_m:100}"><div class="row"><button class="btn" onclick="run(setBase,this)">Usar minha localização atual como sede</button></div></div>
<div class="card"><h3>Dados da empresa no comprovante</h3><label for="cn">Razão social</label><input id="cn" value="${esc(co.name)}"><label for="cj">CNPJ (14 números)</label><input id="cj" inputmode="numeric" maxlength="14" value="${esc(co.cnpj)}"><div class="row"><button class="btn" onclick="run(saveCo,this)">Salvar dados</button></div></div></div>
<div class="card tw" style="margin-top:12px"><h3>Espelho de ponto</h3><div class="row" style="margin:0 0 8px"><input type="month" value="${m}" aria-label="Mês" onchange="S.month=this.value;refresh()"><button class="chip" onclick="run(exportCsv,this)">Exportar marcações (CSV)</button><button class="chip" onclick="run(verificar,this)">Verificar integridade</button></div>
<table><tr><th>Nome</th><th>Dias</th><th>Horas</th><th>Extras</th><th></th></tr>${TS.employees.map(e=>`<tr><td>${esc(e.name)}</td><td>${e.days.length}</td><td>${e.total_hours} h</td><td>${e.overtime_hours} h</td><td>${e.open?'<span class="tag w">marcação em aberto</span>':''}</td></tr>`).join('')}</table></div>
<div class="card" style="margin-top:12px"><h3>Registros</h3>${logRows(L)}</div>`}
async function setBase(){const p=await pos();await api('/settings/workplace','PUT',{lat:p.coords.latitude,lng:p.coords.longitude,radius_m:+$('#rr').value||100});toast('Local de trabalho salvo.','ok');await refresh()}
async function saveCo(){await api('/settings/company','PUT',{name:$('#cn').value.trim(),cnpj:$('#cj').value.trim()});toast('Dados da empresa salvos.','ok')}
async function exportCsv(){const r=await fetch('/time-entries/export.csv?month='+S.month,{headers:{Authorization:'Bearer '+TOKEN}});if(!r.ok)throw new Error('Não foi possível exportar.');const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='marcacoes-'+S.month+'.csv';a.click();URL.revokeObjectURL(a.href)}

TAB.materia=materia;
async function materia(){const M=await api('/materials'),tot=M.reduce((s,m)=>s+m.value,0);
 return `<h1>Matéria-prima</h1><p class="sub">Estoque e custo unitário. O valor em estoque entra no DRE quando não há painel de custo cadastrado.</p>
<div class="grid k4"><div class="card"><h3>Itens</h3><span class="big">${cnt(M.length,'i')}</span></div><div class="card"><h3>Valor em estoque</h3><span class="big">${cnt(tot,'R')}</span></div></div>

</table>${M.length?'':'<p class="sub" style="margin:10px 0 0">Nenhum material ainda. Adicione o primeiro abaixo.</p>'}</div>
<div class="card" style="margin-top:12px"><h3>Novo material</h3><div class="row"><input id="mn" placeholder="Nome"><input id="mu" placeholder="Unidade (kg, m, un)"><input id="ms" type="number" min="0" step="0.01" placeholder="Estoque"><input id="mc" type="number" min="0" step="0.01" placeholder="Custo unitário"></div><div class="row"><button class="btn" onclick="run(addM,this)">Adicionar material</button></div></div>`}
function matRow(id){const tr=$(`[data-k="m${id}"]`);const i=tr.querySelectorAll('input');return {name:i[0].value.trim(),unit:i[1].value.trim()||'un',stock:+i[2].value||0,unit_cost:+i[3].value||0}}

TAB.paineis=paineis;
async function paineis(){const A=await api('/cost-analyses');
 const tot={receita:0,materia:0,custos:0,lucro:0};A.forEach(a=>{tot.receita+=a.revenue;tot.materia+=a.material;tot.custos+=a.custos;tot.lucro+=a.lucro});
 tot.margem_pct=tot.receita?+(tot.lucro/tot.receita*100).toFixed(2):0;
 return `<h1>Painéis de custo</h1><p class="sub">Cada análise alimenta o DRE sintético do painel. Receita − matéria-prima − (opex + impostos) = lucro grosso.</p>
${dreCards(tot)}
<div class="card tw" style="margin-top:12px"><table><tr><th>Título</th><th>Receita</th><th>Matéria-prima</th><th>Opex</th><th>Impostos</th><th>Lucro</th><th>Margem</th><th></th></tr>
${A.map(a=>`<tr data-k="a${a.id}"><td>${esc(a.title)}</td>
<td><input type="number" min="0" step="0.01" value="${a.revenue}" aria-label="Receita" onchange="run(()=>edA(${a.id}))"></td>
<td><input type="number" min="0" step="0.01" value="${a.material}" aria-label="Matéria" onchange="run(()=>edA(${a.id}))"></td>
<td><input type="number" min="0" step="0.01" value="${a.opex}" aria-label="Opex" onchange="run(()=>edA(${a.id}))"></td>
<td><input type="number" min="0" step="0.01" value="${a.tax}" aria-label="Impostos" onchange="run(()=>edA(${a.id}))"></td>
<td><b>${R(a.lucro)}</b></td><td><span class="tag ${a.margem_pct<0?'x':a.margem_pct<20?'w':''}">${a.margem_pct}%</span></td>
<td><button class="chip" onclick="run(()=>delA(${a.id}),this)">×</button></td></tr>`).join('')}
</table>${A.length?'':'<p class="sub" style="margin:10px 0 0">Nenhuma análise ainda. O DRE usa produtos e estoque até você cadastrar a primeira.</p>'}</div>
<div class="card" style="margin-top:12px"><h3>Nova análise</h3><div class="row"><input id="at" placeholder="Título (ex.: LOTE 042 — agosto)"><input id="ar" type="number" min="0" step="0.01" placeholder="Receita bruta"><input id="am" type="number" min="0" step="0.01" placeholder="Consumo MP"><input id="ao" type="number" min="0" step="0.01" placeholder="Custos operacionais"><input id="ax" type="number" min="0" step="0.01" placeholder="Impostos"></div><div class="row"><button class="btn" onclick="run(addA,this)">Adicionar análise</button></div></div>`}

<div class="row"><input data-sn value="${esc(s.name)}" aria-label="Nome"><select data-sk aria-label="Tipo">${Object.keys(KND).map(k=>`<option value="${k}" ${s.kind==k?'selected':''}>${KND[k]}</option>`).join('')}</select><input data-se value="${esc(s.admin_email)}" placeholder="E-mail do administrador"></div>
<div class="row"><button class="chip" onclick="run(()=>edS(${s.id}),this)">Salvar</button><button class="chip" onclick="run(()=>delS(${s.id}),this)">Excluir</button></div></div>`).join(''):'<div class="card"><p class="sub">Nenhum espaço ainda. Crie People Core, Produção ou Financeiro.</p></div>'}</div>
<div class="card" style="margin-top:12px"><h3>Novo espaço</h3><div class="row"><input id="sn" placeholder="Nome (ex.: People Core)"><select id="sk" aria-label="Tipo">${Object.keys(KND).map(k=>`<option value="${k}">${KND[k]}</option>`).join('')}</select><input id="se" placeholder="E-mail do administrador"></div><div class="row"><button class="btn" onclick="run(addS,this)">Adicionar espaço</button></div></div>`}
async function addS(){const n=$('#sn').value.trim();if(!n)return toast('Digite o nome do espaço.','no');await api('/spaces','POST',{name:n,kind:$('#sk').value,admin_email:$('#se').value.trim()});await refresh()}
async function edS(id){const c=$(`[data-k="s${id}"]`);await api('/spaces/'+id,'PUT',{name:c.querySelector('[data-sn]').value.trim(),kind:c.querySelector('[data-sk]').value,admin_email:c.querySelector('[data-se]').value.trim()});toast('Espaço salvo.','ok');await refresh()}
async function delS(id){await api('/spaces/'+id,'DELETE');await gone($(`[data-k="s${id}"]`));await refresh()}

TAB.integracao=integracao;
async function integracao(){const I=await api('/integrations');
 return `<h1>Integração</h1><p class="sub">Webhooks, exportação CSV, WhatsApp e ERP. Ative só o que a operação usa.</p>
<div class="card tw">${I.length?`<table><tr><th>Nome</th><th>Tipo</th><th>Destino</th><th>Estado</th><th></th></tr>
${I.map(i=>`<tr data-k="i${i.id}"><td>${esc(i.name)}</td><td><span class="tag">${INT[i.kind]||i.kind}</span></td><td>${esc(i.endpoint||'—')}</td><td><span class="tag ${i.active?'':'w'}">${i.active?'Ativa':'Pausada'}</span></td>
<td style="white-space:nowrap"><button class="chip" onclick="run(()=>tgI(${i.id},${i.active?0:1},'${esc(i.name)}','${i.kind}','${esc(i.endpoint)}'),this)">${i.active?'Pausar':'Ativar'}</button> <button class="chip" onclick="run(()=>delI(${i.id}),this)">×</button></td></tr>`).join('')}</table>`:'<p class="sub">Nenhuma integração ainda.</p>'}</div>
<div class="card" style="margin-top:12px"><h3>Nova integração</h3><div class="row"><input id="in" placeholder="Nome"><select id="ik" aria-label="Tipo">${Object.keys(INT).map(k=>`<option value="${k}">${INT[k]}</option>`).join('')}</select><input id="ie" placeholder="URL, telefone ou chave"></div><div class="row"><button class="btn" onclick="run(addI,this)">Adicionar integração</button></div></div>`}
async function addI(){const n=$('#in').value.trim();if(!n)return toast('Digite o nome.','no');await api('/integrations','POST',{name:n,kind:$('#ik').value,endpoint:$('#ie').value.trim(),active:true});await refresh()}
async function tgI(id,on,name,kind,endpoint){await api('/integrations/'+id,'PATCH',{name,kind,endpoint,active:!!on});await refresh()}
async function delI(id){await api('/integrations/'+id,'DELETE');await gone($(`[data-k="i${id}"]`));await refresh()}

tela();
</script></body></html>
