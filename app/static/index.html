 return `<h1>Espaços e agenda</h1><p class="sub">Calendário compartilhado de salas, bancadas e recursos. Reservas não podem se sobrepor no mesmo espaço.</p>
 <section class="card"><div class="row"><button class="chip" onclick="shiftSpaceMonth(-1)">‹</button><h3 style="margin:0">${new Date(Date.UTC(year,monthNumber-1,1)).toLocaleDateString('pt-BR',{month:'long',year:'numeric',timeZone:'UTC'})}</h3><button class="chip" onclick="shiftSpaceMonth(1)">›</button></div><div class="month-grid">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(day=>`<div class="weekday">${day}</div>`).join('')}${cells}</div></section>
 <div class="grid g2" style="margin-top:12px">${Sps.map(s=>`<div class="card" data-k="s${s.id}"><h3>${esc(s.name)}<span class="cn">${KND[s.kind]||s.kind}</span></h3><p class="sub">${s.admin_email?esc(s.admin_email):'Recurso compartilhado entre departamentos.'}</p>${ROLE==='admin'?`<div class="row"><input data-sn value="${esc(s.name)}" aria-label="Nome"><select data-sk aria-label="Tipo">${Object.keys(KND).map(k=>`<option value="${k}" ${s.kind===k?'selected':''}>${KND[k]}</option>`).join('')}</select><input data-se value="${esc(s.admin_email)}" placeholder="E-mail de referência"></div><div class="row"><button class="chip" onclick="run(()=>edS(${s.id}),this)">Salvar</button><button class="chip" onclick="run(()=>delS(${s.id}),this)">Excluir</button></div>`:''}</div>`).join('')||'<div class="card"><p class="sub">Cadastre os recursos disponíveis.</p></div>'}</div>
 ${ROLE==='admin'?`<div class="card" style="margin-top:12px"><h3>Novo recurso</h3><div class="row"><input id="sn" placeholder="Nome (sala, bancada, ferramenta)"><select id="sk" aria-label="Tipo">${Object.keys(KND).map(k=>`<option value="${k}">${KND[k]}</option>`).join('')}</select><input id="se" placeholder="E-mail de referência"></div><div class="row"><button class="btn" onclick="run(addS,this)">Adicionar recurso</button></div></div>`:''}
 ${ROLE==='admin'||ROLE==='manager'?`<div class="card" style="margin-top:12px"><h3>Agendar recurso</h3><div class="row"><select id="bookingSpace" aria-label="Recurso">${Sps.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><input id="bookingTitle" placeholder="Atividade / responsável"><input id="bookingStart" type="datetime-local" aria-label="Início"><input id="bookingEnd" type="datetime-local" aria-label="Fim"></div>${ROLE==='admin'?`<div class="row"><select id="bookingDepartment"><option value="">Todos / sem setor</option>${departments.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></div>`:'<p class="sub">A reserva será vinculada ao seu departamento.</p>'}<div class="row"><button class="btn" onclick="run(addBooking,this)" ${Sps.length?'':'disabled'}>Confirmar reserva</button></div></div>`:''}
 ${ROLE==='admin'?`<div class="card" style="margin-top:12px"><h3>Administração do espaço</h3><p class="sub">${spaceAdmin?'Há e-mail de referência cadastrado.':'Cadastre um e-mail de referência no recurso desejado.'} Contas com permissões são configuradas em Segurança.</p></div>`:''}`;
}
function shiftSpaceMonth(delta){const date=new Date((S.spaceMonth||new Date().toISOString().slice(0,7))+'-01T12:00:00');date.setMonth(date.getMonth()+delta);S.spaceMonth=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;refresh()}
async function addBooking(){const start=$('#bookingStart').value,end=$('#bookingEnd').value,title=$('#bookingTitle').value.trim();if(!start||!end||!title)return toast('Preencha a atividade, o início e o fim.','no');const booking={space_id:+$('#bookingSpace').value,title,starts_at:new Date(start).toISOString(),ends_at:new Date(end).toISOString(),...(ROLE==='admin'&&$('#bookingDepartment').value?{department_id:+$('#bookingDepartment').value}:{})};await api('/space-bookings','POST',booking);toast('Recurso reservado.','ok');await refresh()}
async function removeBooking(id){await api(`/space-bookings/${id}`,'DELETE');await refresh()}
async function addS(){const n=$('#sn').value.trim();if(!n)return toast('Digite o nome do espaço.','no');await api('/spaces','POST',{name:n,kind:$('#sk').value,admin_email:$('#se').value.trim()});await refresh()}
async function edS(id){const c=$(`[data-k="s${id}"]`);await api('/spaces/'+id,'PUT',{name:c.querySelector('[data-sn]').value.trim(),kind:c.querySelector('[data-sk]').value,admin_email:c.querySelector('[data-se]').value.trim()});toast('Espaço salvo.','ok');await refresh()}
async function delS(id){await api('/spaces/'+id,'DELETE');await gone($(`[data-k="s${id}"]`));await refresh()}

TAB.integracao=integracao;
async function integracao(){const I=await api('/integrations');
 return `<h1>Integração</h1><p class="sub">Webhooks, exportação CSV, WhatsApp e ERP. Ative só o que a operação usa.</p>
<div class="card tw">${I.length?`<table><tr><th>Nome</th><th>Tipo</th><th>Destino</th><th>Estado</th><th></th></tr>
${I.map(i=>`<tr data-k="i${i.id}"><td>${esc(i.name)}</td><td><span class="tag">${INT[i.kind]||i.kind}</span></td><td>${esc(i.endpoint||'—')}</td><td><span class="tag ${i.active?'':'w'}">${i.active?'Ativa':'Pausada'}</span></td>
<td style="white-space:nowrap"><button class="chip" onclick="run(()=>tgI(${i.id},${i.active?0:1},'${esc(i.name)}','${i.kind}','${esc(i.endpoint)}'),this)">${i.active?'Pausar':'Ativar'}</button> <button class="chip" onclick="run(()=>delI(${i.id}),this)">×</button></td></tr>`).join('')}</table>`:'<p class="sub">Nenhuma integração ainda.</p>'}</div>
<div class="card" style="margin-top:12px"><h3>Nova integração</h3><div class="row"><input id="in" placeholder="Nome"><select id="ik" aria-label="Tipo">${Object.keys(INT).map(k=>`<option value="${k}">${INT[k]}</option>`).join('')}</select><input id="ie" placeholder="URL, telefone ou chave"></div><div class="row"><button class="btn" onclick="run(addI,this)">Adicionar integração</button></div></div>`}
async function addI(){const n=$('#in').value.trim();if(!n)return toast('Digite o nome.','no');await api('/integrations','POST',{name:n,kind:$('#ik').value,endpoint:$('#ie').value.trim(),active:true});await refresh()}
async function tgI(id,on,name,kind,endpoint){await api('/integrations/'+id,'PATCH',{name,kind,endpoint,active:!!on});await refresh()}
async function delI(id){await api('/integrations/'+id,'DELETE');await gone($(`[data-k="i${id}"]`));await refresh()}

TAB.seguranca=seguranca;
async function seguranca(){
 if(ROLE!=='admin'){const totp=await api('/auth/2fa');return `<h1>Segurança da conta</h1><p class="sub">Proteja sua conta com códigos temporários de um aplicativo autenticador.</p><section class="card"><h3>Autenticador de dois fatores</h3><p class="sub">${totp.enabled?'Proteção TOTP ativada para esta conta.':'Ative códigos de 6 dígitos usando Google Authenticator, Authy ou outro aplicativo compatível.'}</p><div id="totpSetup"></div>${totp.enabled?'<div class="row"><input id="totpDisableCode" inputmode="numeric" maxlength="6" placeholder="Código atual"><button class="chip" onclick="run(disableTotp,this)">Desativar 2FA</button></div>':'<button class="btn" onclick="run(beginTotp,this)">Configurar 2FA</button>'}</section>`}
 const [accounts,audit,totp,channels,departments,clockIp,account,matrix,operational,operations]=await Promise.all([api('/team/accounts'),api('/audit?limit=25'),api('/auth/2fa'),api('/notification-channels'),api('/departments'),api('/settings/clock-ip'),api('/auth/account'),api('/admin/permissions'),api('/admin/operational-settings'),api('/admin/operations')]);
 const registeredEmployees=await api('/employees');
 const matrixRows=['manager','operator'].flatMap(role=>[...new Map(matrix.filter(item=>item.role===role).map(item=>[item.module,item.module_name])).entries()].map(([module,moduleName])=>`<tr><td>${role==='manager'?'Gestor':'Operador'}</td><td>${esc(moduleName)}</td>${['view','create','edit','approve','delete'].map(permission=>{const item=matrix.find(entry=>entry.role===role&&entry.module===module&&entry.permission===permission);return `<td>${item?`<input type="checkbox" aria-label="${role} ${moduleName} ${permission}" data-permission="${role}|${module}|${permission}" ${item.allowed?'checked':''} ${item.delegable?'':'disabled'}>`:'—'}</td>`}).join('')}</tr>`)).join('');
 return `<h1>Segurança e notificações</h1><p class="sub">Acesso por função, autenticação em duas etapas, trilha de auditoria e destinos de alerta.</p>
 <section class="card"><h3>Minha conta de administrador</h3><p class="sub">Atualize seu nome de usuário, e-mail ou senha. Para salvar qualquer alteração, confirme sua senha atual.</p><div class="grid g2"><div><label for="accountUsername">Nome de usuário</label><input id="accountUsername" maxlength="80" autocomplete="name" value="${esc(account.username)}"></div><div><label for="accountEmail">E-mail de acesso</label><input id="accountEmail" type="email" maxlength="254" autocomplete="email" value="${esc(account.email)}"></div><div><label for="accountCurrentPassword">Senha atual</label><input id="accountCurrentPassword" type="password" autocomplete="current-password"></div><div><label for="accountNewPassword">Nova senha (opcional, mínimo 8 caracteres)</label><input id="accountNewPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password"></div></div><div class="row"><button class="btn" onclick="run(saveOwnAccount,this)">Salvar dados da conta</button></div></section>
 <div class="grid g2"><section class="card"><h3>Autenticador de dois fatores</h3><p class="sub">${totp.enabled?'Proteção TOTP ativada para esta conta.':'Ative códigos de 6 dígitos usando Google Authenticator, Authy ou outro aplicativo compatível.'}</p><div id="totpSetup"></div>${totp.enabled?'<div class="row"><input id="totpDisableCode" inputmode="numeric" maxlength="6" placeholder="Código atual"><button class="chip" onclick="run(disableTotp,this)">Desativar 2FA</button></div>':'<button class="btn" onclick="run(beginTotp,this)">Configurar 2FA</button>'}</section>
 <section class="card"><h3>Canais de aviso</h3><p class="sub">E-mail usa SMTP; WhatsApp usa a Cloud API. Credenciais ficam somente nas variáveis de ambiente do servidor.</p>
 ${channels.map(channel=>`<div class="row" style="align-items:center"><span>${channel.kind==='email'?'E-mail':'WhatsApp'} · ${esc(channel.recipient)}</span><button class="chip" onclick="run(()=>removeChannel(${channel.id}),this)">Remover</button></div>`).join('')||'<p class="sub">Nenhum destino cadastrado.</p>'}
 <div class="row"><select id="channelKind" aria-label="Tipo de canal"><option value="email">E-mail</option><option value="whatsapp">WhatsApp</option></select><input id="channelRecipient" placeholder="E-mail ou telefone com código do país"></div><div class="row"><button class="chip" onclick="run(addChannel,this)">Adicionar canal</button><button class="chip" onclick="run(sendTestNotification,this)">Enviar teste</button></div></section>
 <section class="card"><h3>Restrição de rede para o ponto</h3><p class="sub">Opcional: uma faixa CIDR por linha. Quando configurada, o registro exige GPS válido e IP dentro das faixas (ex.: 192.168.1.0/24).</p><textarea id="clockIpRanges" rows="4" placeholder="192.168.1.0/24">${esc(clockIp.ranges.join('\n'))}</textarea><div class="row"><button class="chip" onclick="run(saveClockIp,this)">Salvar faixas permitidas</button></div></section></div>
 <section class="card tw" style="margin-top:12px"><h3>Contas e funções</h3><p class="sub">Administrador: controle total. Gestor: quadro, busca e aprovações. Operador: consulta dos quadros.</p>
 <table><tr><th>Conta</th><th>Função</th><th>Funcionário cadastrado</th><th>Departamento</th><th></th></tr>${accounts.map((account,index)=>`<tr data-account="${esc(account.user)}"><td>${esc(account.user)}</td><td>${account.role==='admin'?'<span class="tag">Administrador</span>':`<select id="team-role-${index}" aria-label="Função">${[['manager','Gestor'],['operator','Operador']].map(([value,label])=>`<option value="${value}" ${account.role===value?'selected':''}>${label}</option>`).join('')}</select>`}</td><td>${account.role==='admin'?'—':`<select id="team-employee-${index}" aria-label="Funcionário cadastrado"><option value="">Selecione um funcionário</option>${registeredEmployees.filter(e=>e.active).map(e=>`<option value="${e.id}" ${account.employee_id===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select>`}</td><td>${account.role==='admin'?'—':`<select id="team-dept-${index}" aria-label="Departamento"><option value="">Sem departamento</option>${departments.map(department=>`<option value="${department.id}" ${account.department_id===department.id?'selected':''}>${esc(department.name)}</option>`).join('')}</select>`}</td><td>${account.role==='admin'?'':`<button class="chip" onclick="run(()=>saveTeamRole(this,${index}),this)">Salvar</button>`}</td></tr>`).join('')}</table></section>
 <section class="card tw" style="margin-top:12px"><h3>Matriz de permissões</h3><p class="sub">Permissões são verificadas no servidor para quadros, reservas e aprovações. Acesso sensível a RH, folha, financeiro, custeio e integrações permanece exclusivo do administrador até existir escopo seguro por setor.</p><table><tr><th>Função</th><th>Módulo</th><th>Ver</th><th>Criar</th><th>Editar</th><th>Aprovar</th><th>Excluir</th></tr>${matrixRows}</table><div class="row"><button class="chip" onclick="run(savePermissionMatrix,this)">Salvar matriz</button></div></section>
 <section class="card" style="margin-top:12px"><h3>Parâmetros globais de operação</h3><p class="sub">A validação de GPS e o alerta de pausa são aplicados nos registros do ponto. Limite de orçamento zero desativa o alerta de teto.</p><div class="grid g2"><div><label for="policyGps">Precisão máxima do GPS (m)</label><input id="policyGps" type="number" min="5" max="100" value="${operational.clock_gps_accuracy_m}"></div><div><label for="policySpread">Dispersão máxima das leituras (m)</label><input id="policySpread" type="number" min="10" max="250" value="${operational.clock_max_spread_m}"></div><div><label for="policyBreak">Aviso de intervalo após (minutos)</label><input id="policyBreak" type="number" min="60" max="600" value="${operational.clock_break_alert_minutes}"></div><div><label for="policyHours">Jornada diária de referência (h)</label><input id="policyHours" type="number" min="1" max="16" step=".25" value="${operational.daily_hours}"></div><div><label for="policyBudget">Teto global de orçamento (R$; 0 desativa)</label><input id="policyBudget" type="number" min="0" step=".01" value="${operational.budget_limit}"></div></div><div class="row"><button class="chip" onclick="run(saveOperationalSettings,this)">Salvar parâmetros</button></div></section>
 <section class="card tw" style="margin-top:12px"><h3>Custo x produtividade · ${esc(operations.month)}</h3><p class="sub">Horas extras e custo estimado por departamento; absenteísmo estimado por dias úteis e produtividade por conclusão de tarefas. ${esc(operations.absenteeism_basis)}</p><table><tr><th>Departamento</th><th>Equipe</th><th>Horas extras</th><th>Custo de extras</th><th>Absenteísmo estimado</th><th>Lotes/tarefas concluídos</th><th>Produtividade</th></tr>${operations.departments.map(department=>`<tr><td>${esc(department.department)}</td><td>${department.employees}</td><td>${department.overtime_hours} h</td><td>${R(department.overtime_cost)}</td><td>${department.absenteeism_pct}%</td><td>${department.completed_tasks}</td><td>${department.task_completion_pct}%</td></tr>`).join('')||'<tr><td colspan="7">Sem dados no período.</td></tr>'}</table></section>
 <section class="card tw" style="margin-top:12px"><h3>Auditoria · últimas 25 ações</h3><table><tr><th>Data/hora</th><th>Conta</th><th>Ação</th><th>Recurso</th><th>HTTP</th><th>IP</th></tr>${audit.map(item=>`<tr><td>${esc(when(item.at))}</td><td>${esc(item.actor||'anônimo')}</td><td>${esc(item.action)}</td><td>${esc(item.resource)}</td><td>${item.status}</td><td>${esc(item.ip)}</td></tr>`).join('')}</table></section>`
}
async function beginTotp(){const setup=await api('/auth/2fa/setup','POST');$('#totpSetup').innerHTML=`<p class="sub">Cadastre esta chave no aplicativo autenticador: <strong>${esc(setup.secret)}</strong></p><p class="sub">URI para QR: <code>${esc(setup.otpauth_url)}</code></p><div class="row"><input id="totpEnableCode" inputmode="numeric" maxlength="6" placeholder="Código de 6 dígitos"><button class="chip" onclick="run(enableTotp,this)">Confirmar e ativar</button></div>`}
async function enableTotp(){await api('/auth/2fa/enable','POST',{code:$('#totpEnableCode').value.trim()});toast('Autenticação em duas etapas ativada.','ok');await refresh()}
async function disableTotp(){await api('/auth/2fa/disable','POST',{code:$('#totpDisableCode').value.trim()});toast('Autenticação em duas etapas desativada.','ok');await refresh()}
async function saveOwnAccount(){const username=$('#accountUsername').value.trim(),email=$('#accountEmail').value.trim(),current_password=$('#accountCurrentPassword').value,new_password=$('#accountNewPassword').value;if(!current_password)throw new Error('Digite sua senha atual para confirmar as alterações.');if(new_password&&new_password.length<8)throw new Error('A nova senha precisa ter pelo menos 8 caracteres.');const account=await api('/auth/account','PUT',{username,email,current_password,...(new_password?{new_password}:{})});CURRENT_NAME=account.username;try{sessionStorage.setItem('name',CURRENT_NAME)}catch(e){}$('#accountCurrentPassword').value='';$('#accountNewPassword').value='';toast('Dados da conta atualizados.','ok');await refresh()}
async function savePermissionMatrix(){const permissions=[...document.querySelectorAll('[data-permission]')].map(input=>{const [role,module,permission]=input.dataset.permission.split('|');return{role,module,permission,allowed:input.checked}});await api('/admin/permissions','PUT',{permissions});toast('Matriz de permissões salva e aplicada no servidor.','ok');await refresh()}
async function saveOperationalSettings(){const value={clock_gps_accuracy_m:+$('#policyGps').value,clock_max_spread_m:+$('#policySpread').value,clock_break_alert_minutes:+$('#policyBreak').value,daily_hours:+$('#policyHours').value,budget_limit:+$('#policyBudget').value};await api('/admin/operational-settings','PUT',value);toast('Parâmetros operacionais atualizados.','ok');await refresh()}
async function saveTeamRole(button,index){const row=button.closest('[data-account]'),role=$(`#team-role-${index}`).value,department_id=+$(`#team-dept-${index}`).value||null;await api('/team/accounts/'+encodeURIComponent(row.dataset.account),'PATCH',{role,department_id,employee_id:+$(`#team-employee-${index}`).value||null});toast('Permissões salvas; a conta precisa entrar novamente.','ok');await refresh()}
async function saveClockIp(){const ranges=$('#clockIpRanges').value.split('\n').map(value=>value.trim()).filter(Boolean);const saved=await api('/settings/clock-ip','PUT',{ranges});$('#clockIpRanges').value=saved.ranges.join('\n');toast('Faixas de rede salvas.','ok')}
async function addChannel(){await api('/notification-channels','POST',{kind:$('#channelKind').value,recipient:$('#channelRecipient').value.trim()});await refresh()}
async function removeChannel(id){await api('/notification-channels/'+id,'DELETE');await refresh()}
async function sendTestNotification(){const result=await api('/notifications/test','POST',{message:'Este é um aviso de teste do SIGI.'});toast(`Teste enviado para ${result.sent} canal(is).`,'ok')}

</script><script src="/business.js"></script>
<script src="/enhancements.js"></script><script>tela();</script></body></html>
